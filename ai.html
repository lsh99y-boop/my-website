<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI 정비 지식 검색</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <script>try{var t=localStorage.getItem("ilji_theme");if(t)document.documentElement.setAttribute("data-theme",t);}catch(e){}</script>
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#2563eb" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32" />
  <script>if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){});});}</script>
  <style>
    :root {
      --bg:#f4f5f8; --surface:#ffffff; --surface-2:#f5f6f9; --line:#e7e9ef; --line-strong:#d8dbe3;
      --ink:#1b1f2a; --muted:#6b7280;
      --accent:#2563eb; --accent-ink:#ffffff; --accent-weak:#eef0fe; --accent-border:#dadcfb;
      --green:#16a34a; --amber:#c77905; --danger:#dc2626;
      --shadow-sm:0 1px 2px rgba(16,24,40,.05); --shadow:0 2px 4px rgba(16,24,40,.04), 0 10px 24px rgba(16,24,40,.07);
      --radius:14px;
    }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
      --bg:#0e131c; --surface:#161c28; --surface-2:#1e2532; --line:#2a3342; --line-strong:#3a4455;
      --ink:#e6e9f0; --muted:#96a1b4;
      --accent:#60a5fa; --accent-ink:#0e131c; --accent-weak:#232b45; --accent-border:#3a4468;
      --green:#4ade80; --amber:#fbbf24; --danger:#f87171;
      --shadow-sm:0 1px 2px rgba(0,0,0,.4); --shadow:0 2px 6px rgba(0,0,0,.35), 0 12px 30px rgba(0,0,0,.42);
    } }
    :root[data-theme="dark"] {
      --bg:#0e131c; --surface:#161c28; --surface-2:#1e2532; --line:#2a3342; --line-strong:#3a4455;
      --ink:#e6e9f0; --muted:#96a1b4;
      --accent:#60a5fa; --accent-ink:#0e131c; --accent-weak:#232b45; --accent-border:#3a4468;
      --green:#4ade80; --amber:#fbbf24; --danger:#f87171;
      --shadow-sm:0 1px 2px rgba(0,0,0,.4); --shadow:0 2px 6px rgba(0,0,0,.35), 0 12px 30px rgba(0,0,0,.42);
    }
    * { box-sizing:border-box; }
    body { font-family:"Pretendard Variable",Pretendard,system-ui,"Malgun Gothic",sans-serif; margin:0; background:var(--bg); color:var(--ink); -webkit-font-smoothing:antialiased; }
    .topbar { position:sticky; top:0; z-index:50; background:var(--surface); border-bottom:1px solid var(--line); box-shadow:var(--shadow-sm); }
    .topbar-inner { max-width:920px; margin:0 auto; padding:11px 18px; display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
    .brand { font-weight:800; font-size:1.05rem; letter-spacing:-.01em; }
    .tb-actions { margin-left:auto; display:flex; gap:8px; align-items:center; }
    .tb-btn { color:var(--accent); background:var(--surface); text-decoration:none; font-weight:600; font-size:.84rem; white-space:nowrap; border:1px solid var(--accent-border); border-radius:9px; padding:8px 12px; cursor:pointer; }
    .tb-btn:hover { background:var(--accent-weak); }
    .icon-btn { padding:8px 10px; font-size:1rem; line-height:1; }
    main { max-width:920px; margin:20px auto; padding:0 16px 80px; }

    .searchbox { background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:16px; box-shadow:var(--shadow-sm); }
    .searchbox h1 { font-size:1.15rem; margin:0 0 3px; display:flex; align-items:center; gap:8px; }
    .searchbox .desc { font-size:.84rem; color:var(--muted); margin-bottom:12px; }
    .qrow { display:flex; gap:8px; }
    #q { flex:1; font:inherit; color:var(--ink); background:var(--surface); border:1px solid var(--line-strong); border-radius:10px; padding:12px 14px; resize:none; min-height:52px; line-height:1.5; }
    #q:focus { outline:2px solid var(--accent); border-color:var(--accent); }
    .btn-primary { background:var(--accent); color:var(--accent-ink); border:0; border-radius:10px; font-weight:700; padding:0 18px; cursor:pointer; white-space:nowrap; }
    .btn-primary:disabled { opacity:.5; cursor:default; }
    .chips { display:flex; flex-wrap:wrap; gap:7px; margin-top:12px; }
    .chip { background:var(--surface-2); border:1px solid var(--line); border-radius:20px; padding:6px 12px; font-size:.82rem; color:var(--ink); cursor:pointer; }
    .chip:hover { background:var(--accent-weak); border-color:var(--accent-border); color:var(--accent); }

    .aibar { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-top:12px; font-size:.82rem; color:var(--muted); }
    .ai-toggle { background:var(--surface-2); border:1px solid var(--line-strong); border-radius:9px; padding:7px 12px; font-weight:600; color:var(--ink); cursor:pointer; }
    .ai-toggle:hover { background:var(--accent-weak); border-color:var(--accent-border); color:var(--accent); }
    .prog { flex:1; min-width:120px; height:6px; background:var(--surface-2); border-radius:4px; overflow:hidden; display:none; }
    .prog > i { display:block; height:100%; width:0; background:var(--accent); transition:width .2s; }

    #status { font-size:.85rem; color:var(--muted); margin:14px 2px 6px; min-height:1.1em; }
    #status.err { color:var(--danger); }

    .ai-answer { background:var(--accent-weak); border:1px solid var(--accent-border); border-radius:var(--radius); padding:15px 17px; margin:14px 0; white-space:pre-wrap; line-height:1.65; font-size:.95rem; }
    .ai-answer .h { font-weight:800; color:var(--accent); margin-bottom:6px; display:flex; align-items:center; gap:7px; }

    .sec { margin-top:18px; }
    .sec h2 { font-size:.98rem; margin:0 0 9px; display:flex; align-items:center; gap:7px; }
    .sec h2 .cnt { font-size:.78rem; color:var(--muted); font-weight:600; }
    .rec { border:1px solid var(--line); border-radius:11px; padding:11px 13px; margin-bottom:9px; background:var(--surface); box-shadow:var(--shadow-sm); }
    .rec .top { display:flex; gap:7px; align-items:center; flex-wrap:wrap; font-size:.78rem; color:var(--muted); }
    .tag { background:var(--surface-2); border-radius:20px; padding:2px 9px; font-weight:600; }
    .tag.src-f { background:color-mix(in srgb, var(--accent) 15%, var(--surface)); color:var(--accent); }
    .tag.src-l { background:color-mix(in srgb, var(--green) 16%, var(--surface)); color:var(--green); }
    .rec .model { font-weight:800; color:var(--accent); margin:5px 0 2px; }
    .rec .kv { font-size:.9rem; margin-top:3px; line-height:1.5; }
    .rec .kv b { color:var(--muted); font-weight:700; font-size:.8rem; }
    .rec .snip { font-size:.9rem; margin-top:4px; white-space:pre-wrap; line-height:1.5; }
    .rec .acts { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
    .rec .acts a { font-size:.8rem; font-weight:700; text-decoration:none; color:var(--accent); background:var(--accent-weak); border:1px solid var(--accent-border); border-radius:8px; padding:5px 11px; }
    .rec .acts a:hover { background:color-mix(in srgb, var(--accent) 18%, var(--surface)); }
    .rec .acts a.file { color:var(--green); background:color-mix(in srgb, var(--green) 13%, var(--surface)); border-color:color-mix(in srgb, var(--green) 32%, var(--surface)); }
    .empty { color:var(--muted); text-align:center; padding:18px 8px; font-size:.9rem; }
    .note { font-size:.8rem; color:var(--muted); margin-top:18px; text-align:center; line-height:1.6; }
  </style>
</head>
<body>
  <div id="pinGate" style="position:fixed;inset:0;background:#0e1420;z-index:9999;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;color:#e6ebf2;padding:20px;text-align:center">
    <div style="font-size:1.3rem;font-weight:700">🤖 AI 정비 지식 검색</div>
    <div style="color:#8a94a3;font-size:.9rem">접속 PIN을 입력하세요</div>
    <input id="pinInput" type="password" inputmode="numeric" maxlength="12" placeholder="PIN"
           style="font-size:1.4rem;text-align:center;letter-spacing:.25em;padding:10px 16px;border-radius:8px;border:1px solid #2a3550;background:#182130;color:#fff;width:200px" />
    <button id="pinOk" style="background:#2563eb;color:#fff;padding:11px 28px;font-size:1rem;border:0;border-radius:8px;cursor:pointer">확인</button>
    <div id="pinErr" style="color:#ff6b6b;font-size:.85rem;height:1.1em"></div>
  </div>

  <div class="topbar">
    <div class="topbar-inner">
      <div class="brand">🤖 AI 정비 지식 검색</div>
      <div class="tb-actions">
        <a class="tb-btn" href="index.html">🏠 홈</a>
        <a class="tb-btn" href="cases.html">🔧 정비사례</a>
        <a class="tb-btn" href="analysis.html">📊 분석</a>
        <button class="tb-btn icon-btn" id="themeToggle" title="라이트/다크 전환">🌙</button>
      </div>
    </div>
  </div>

  <main>
    <div class="searchbox">
      <h1>🤖 AI 정비 지식 검색</h1>
      <div class="desc">정비사례 · 일일업무일지 · <b>장비 매뉴얼</b>을 <b>한 번에</b> 검색합니다. 자연어로 물어보세요.</div>
      <div class="qrow">
        <textarea id="q" placeholder="예: 계룡산 송신기 엑사이터 관련 정비내용 찾아줘"></textarea>
        <button class="btn-primary" id="go">검색</button>
      </div>
      <div class="chips" id="chips"></div>
      <div class="aibar">
        <label style="display:flex;align-items:center;gap:7px;cursor:pointer"><input type="checkbox" id="aiOn" checked /> 🤖 AI 요약 함께 보기</label>
        <span id="aiState">검색 결과를 AI가 한국어로 요약해 줍니다.</span>
      </div>
    </div>

    <div id="status"></div>
    <div id="aiAnswer"></div>

    <div class="sec">
      <h2>🔧 관련 정비사례 <span class="cnt" id="cntF"></span></h2>
      <div id="faults"><div class="empty">검색어를 입력하고 검색하세요.</div></div>
    </div>
    <div class="sec">
      <h2>📋 관련 일일업무일지 <span class="cnt" id="cntL"></span></h2>
      <div id="logs"><div class="empty">—</div></div>
    </div>
    <div class="sec">
      <h2>📘 관련 매뉴얼 <span class="cnt" id="cntM"></span></h2>
      <div id="manuals"><div class="empty">—</div></div>
    </div>

    <div class="note">
      ※ AI는 <b>검색된 실제 기록만</b> 근거로 요약합니다. 기록에 없는 원인·조치는 지어내지 않아요.<br>
      ※ 통계·상세 그래프는 <a href="analysis.html" style="color:var(--accent)">📊 데이터 분석</a>에서 보세요.
    </div>
  </main>

  <script type="module">
    import { knowledgeSearch, buildContext, extractConditions } from "./aiSearch.js";
    import { docUrl } from "./docStorage.js";
    import { supabase } from "./supabaseClient.js";

    const APP_PIN = "7590";
    (function () {
      const gate = document.getElementById("pinGate");
      if (localStorage.getItem("ilji_pin_ok") === APP_PIN) { gate.remove(); return; }
      const inp = document.getElementById("pinInput"), err = document.getElementById("pinErr");
      const go = () => { if (inp.value === APP_PIN) { localStorage.setItem("ilji_pin_ok", APP_PIN); gate.remove(); } else { err.textContent = "PIN이 틀렸어요"; inp.value = ""; inp.focus(); } };
      document.getElementById("pinOk").addEventListener("click", go);
      inp.addEventListener("keydown", (e) => { if (e.key === "Enter") go(); });
      inp.focus();
    })();

    const tbtn = document.getElementById("themeToggle");
    function paint(t) { const r = document.documentElement; if (t) r.setAttribute("data-theme", t); else r.removeAttribute("data-theme"); tbtn.textContent = (t ? t === "dark" : matchMedia("(prefers-color-scheme: dark)").matches) ? "☀️" : "🌙"; }
    paint(localStorage.getItem("ilji_theme"));
    tbtn.addEventListener("click", () => { const r = document.documentElement; const cur = r.getAttribute("data-theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"); const nx = cur === "dark" ? "light" : "dark"; localStorage.setItem("ilji_theme", nx); paint(nx); });

    const $ = (id) => document.getElementById(id);
    const esc = (s) => (s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;");
    const setStatus = (m, err) => { const s = $("status"); s.textContent = m || ""; s.className = err ? "err" : ""; };
    const errText = (e) => { const m = (e && e.message) || String(e || ""); return /failed to fetch|networkerror|load failed|fetch/i.test(m) ? "서버 연결 실패 — 서버가 잠자고 있거나 네트워크 문제일 수 있어요. 잠시 후 다시 시도하거나 관리자에게 문의하세요." : m; };

    const SUGGEST = [
      "최근 정비사례를 알려줘",
      "계룡산 반복고장을 찾아줘",
      "엑사이터 관련 정비내용을 찾아줘",
      "올해 계룡산 송신기 정비 내용",
      "과거에 비슷한 고장이 발생했을 때 어떻게 조치했어?",
      "최근에 GPS 관련 정비를 한 시설을 찾아줘",
    ];
    $("chips").innerHTML = SUGGEST.map((s) => `<span class="chip">${esc(s)}</span>`).join("");
    $("chips").querySelectorAll(".chip").forEach((c) => c.addEventListener("click", () => { $("q").value = c.textContent; doSearch(); }));

    // ===== AI 요약 (사내 Baze — 서버 함수 manual-ai 의 chat 모드) =====
    const NEED_PASS = new Error("passcode");
    async function callChat(question, ctx) {
      let pass = ""; try { pass = localStorage.getItem("ilji_ai_pass") || ""; } catch (e) {}
      const { data, error } = await supabase.functions.invoke("manual-ai", { body: { mode: "chat", question, context: ctx, passcode: pass } });
      let res = data;
      if (error) {
        try { res = await error.context.json(); }
        catch (e) { res = { error: /failed to send/i.test(error.message || "") ? "AI 서버 함수(manual-ai)에 연결하지 못했어요. 함수가 배포됐는지 확인하세요." : error.message }; }
      }
      if (res && res.code === "passcode") { try { localStorage.removeItem("ilji_ai_pass"); } catch (e) {} throw NEED_PASS; }
      return res || { error: "응답이 없어요." };
    }
    function showPassForm(wrong, question, faults, logs, manuals) {
      $("aiAnswer").innerHTML = `<div class="ai-answer"><div class="h">🤖 AI 요약</div><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">${wrong ? '<span style="color:var(--danger)">비밀번호가 맞지 않아요. 다시 입력하세요.</span>' : "AI 기능 비밀번호를 입력하세요."}<input id="aiPass" type="password" autocomplete="off" style="padding:8px 11px;border-radius:8px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);width:160px"/><button class="btn-primary" id="aiPassOk" style="padding:8px 15px">확인</button></div></div>`;
      const go = () => { const v = $("aiPass").value.trim(); if (!v) return; try { localStorage.setItem("ilji_ai_pass", v); } catch (e) {} aiSummarize(question, faults, logs, manuals, true); };
      $("aiPassOk").addEventListener("click", go);
      $("aiPass").addEventListener("keydown", (e) => { if (e.key === "Enter") go(); });
      $("aiPass").focus();
    }
    async function aiSummarize(question, faults, logs, manuals = [], afterPass) {
      if (!$("aiOn").checked) return;
      if (!faults.length && !logs.length && !manuals.length) { renderAnswer("검색 결과가 없어 요약할 내용이 없습니다."); return; }
      const ctx = buildContext(faults, logs, manuals);
      renderAnswer("AI가 검색 결과를 요약하는 중… (10초 안팎)");
      try {
        const res = await callChat(question, ctx);
        if (res.error || !res.answer) { renderAnswer("AI 요약 실패: " + (res.error || "응답 없음") + "\n아래 검색 결과를 참고하세요."); return; }
        renderAnswer(res.answer);
      } catch (e) {
        if (e === NEED_PASS) showPassForm(afterPass === true, question, faults, logs, manuals);
        else renderAnswer("AI 요약 오류: " + errText(e) + "\n아래 검색 결과를 참고하세요.");
      }
    }
    function renderAnswer(text) {
      $("aiAnswer").innerHTML = `<div class="ai-answer"><div class="h">🤖 AI 요약</div>${esc(text)}</div>`;
    }

    // ===== 렌더 =====
    function renderFaults(list) {
      $("cntF").textContent = list.length ? `${list.length}건` : "";
      const el = $("faults");
      if (!list.length) { el.innerHTML = `<div class="empty">관련 정비사례가 없어요</div>`; return; }
      el.innerHTML = list.map((f) => `
        <div class="rec">
          <div class="top"><span class="tag src-f">정비사례</span><span class="tag">${esc(f.office)}</span><span class="tag">${esc(f.site)}</span>${f.equip ? `<span class="tag">${esc(f.equip)}</span>` : ""}<span style="margin-left:auto">${esc(f.date)}</span></div>
          <div class="model">${esc(f.model || "(모델 미입력)")}</div>
          ${f.symptom ? `<div class="kv"><b>증상</b> ${esc(f.symptom)}</div>` : ""}
          ${f.action ? `<div class="kv"><b>조치</b> ${esc(f.action)}</div>` : ""}
          <div class="acts">
            <a href="cases.html?case=${encodeURIComponent(f.id)}">🔧 상세 열기</a>
            ${f.doc_path ? `<a class="file" href="${docUrl(f.doc_path)}" target="_blank" rel="noopener">📎 첨부파일 보기</a>` : ""}
          </div>
        </div>`).join("");
    }
    function renderLogs(list) {
      $("cntL").textContent = list.length ? `${list.length}건` : "";
      const el = $("logs");
      if (!list.length) { el.innerHTML = `<div class="empty">관련 일지 기록이 없어요</div>`; return; }
      el.innerHTML = list.map((l) => `
        <div class="rec">
          <div class="top"><span class="tag src-l">일일업무일지</span><span class="tag">${esc(l.office)}</span><span class="tag">${esc(l.site)}</span><span style="margin-left:auto">${esc(l.date)}</span></div>
          <div class="snip">${esc(l.text)}</div>
          <div class="acts">
            <a href="daily.html?office=${encodeURIComponent(l.office)}&date=${encodeURIComponent(l.date)}">📋 이 날 일지 열기</a>
          </div>
        </div>`).join("");
    }

    function renderManuals(list) {
      $("cntM").textContent = list.length ? `${list.length}건` : "";
      const el = $("manuals");
      if (!list.length) { el.innerHTML = `<div class="empty">관련 매뉴얼이 없어요</div>`; return; }
      el.innerHTML = list.map((m) => `
        <div class="rec">
          <div class="top"><span class="tag" style="background:color-mix(in srgb, var(--amber) 16%, var(--surface));color:var(--amber)">매뉴얼</span>${m.equip ? `<span class="tag">${esc(m.equip)}</span>` : ""}${m.maker ? `<span class="tag">${esc(m.maker)}</span>` : ""}${m.model ? `<span class="tag">${esc(m.model)}</span>` : ""}</div>
          <div class="model">${esc(m.title || "(제목 없음)")}</div>
          ${m.snippet ? `<div class="snip">${esc(m.snippet)}</div>` : ""}
          <div class="acts">
            <a href="manuals.html?id=${encodeURIComponent(m.id)}">📘 매뉴얼 열기</a>
            ${m.doc_path ? `<a class="file" href="${docUrl(m.doc_path)}" target="_blank" rel="noopener">📎 원본 PDF</a>` : ""}
          </div>
        </div>`).join("");
    }

    async function doSearch() {
      const question = $("q").value.trim();
      if (!question) { setStatus("질문을 입력하세요.", true); return; }
      $("go").disabled = true;
      $("aiAnswer").innerHTML = "";
      setStatus("검색 중…");
      try {
        const { cond, faults, logs, manuals } = await knowledgeSearch(question);
        renderFaults(faults); renderLogs(logs); renderManuals(manuals || []);
        const bits = [];
        if (cond.sites.length) bits.push("시설:" + cond.sites.join(","));
        if (cond.equips.length) bits.push("장비:" + cond.equips.join(","));
        if (cond.topics.length) bits.push("키워드:" + cond.topics.join(","));
        if (cond.from) bits.push("기간:" + cond.from + (cond.to ? "~" + cond.to : "~"));
        setStatus(`정비사례 ${faults.length}건 · 일지 ${logs.length}건 · 매뉴얼 ${(manuals || []).length}건` + (bits.length ? ` (인식: ${bits.join(" / ")})` : ""));
        aiSummarize(question, faults, logs, manuals || []);
      } catch (e) {
        setStatus("검색 오류: " + errText(e), true);
      } finally { $("go").disabled = false; }
    }
    $("go").addEventListener("click", doSearch);
    $("q").addEventListener("keydown", (e) => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) doSearch(); });

    // 홈에서 넘어온 질문(?q=) 자동 검색
    (function () {
      const preQ = new URLSearchParams(location.search).get("q");
      if (preQ) { $("q").value = preQ; if (localStorage.getItem("ilji_pin_ok") === APP_PIN) setTimeout(doSearch, 60); }
    })();
  </script>
</body>
</html>
