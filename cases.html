<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>장비 고장·정비 사례</title>
  <style>
    :root { --line:#d7dbe0; --bg:#eef1f5; --accent:#2f6fed; --ink:#1a2230; --muted:#6b7480; }
    * { box-sizing: border-box; }
    body { font-family: system-ui, "Malgun Gothic", sans-serif; margin: 0; background: var(--bg); color: var(--ink); }

    .topbar { position: sticky; top: 0; z-index: 50; background:#fff; border-bottom:1px solid var(--line); box-shadow:0 1px 4px rgba(0,0,0,.04); }
    .topbar-inner { max-width:1140px; margin:0 auto; padding:11px 18px; display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
    .brand { font-weight:800; font-size:1.05rem; white-space:nowrap; }
    .brand small { display:block; font-weight:400; color:var(--muted); font-size:.72rem; }
    .tb-actions { margin-left:auto; display:flex; gap:8px; }
    .tb-actions a { color:var(--accent); background:#fff; text-decoration:none; font-weight:600; font-size:.84rem; white-space:nowrap; border:1px solid #cfdcfb; border-radius:8px; padding:8px 12px; }

    main { max-width:1140px; margin:16px auto; padding:0 16px 60px; }
    .card { background:#fff; border:1px solid var(--line); border-radius:12px; padding:16px 18px; margin-bottom:16px; }
    .card h2 { font-size:1rem; margin:0 0 12px; }
    label { font-size:.78rem; color:#445; font-weight:600; display:block; margin-bottom:4px; }
    input, select, textarea { font:inherit; border:1px solid var(--line); border-radius:7px; padding:8px 10px; background:#fff; width:100%; }
    input:focus, select:focus, textarea:focus { outline:2px solid var(--accent); border-color:var(--accent); }
    textarea { min-height:58px; resize:vertical; line-height:1.5; }
    button { font:inherit; font-weight:600; border:0; border-radius:8px; padding:10px 18px; cursor:pointer; }
    .primary { background:var(--accent); color:#fff; }
    .ghost { background:#eef1f5; color:var(--ink); }
    .blue { background:#e8eefc; color:var(--accent); }
    .danger { background:#fdecea; color:#b3261e; }
    .grid { display:grid; gap:12px; }

    /* 검색 */
    .searchrow { display:flex; gap:10px; flex-wrap:wrap; align-items:end; }
    .searchrow .q { flex:2; min-width:200px; }
    .searchrow .f { flex:1; min-width:120px; }

    /* 목록 (카드형) */
    #results { display:grid; gap:10px; }
    .caserow { border:1px solid var(--line); border-radius:10px; padding:11px 14px; cursor:pointer; background:#fff; transition:.1s; }
    .caserow:hover { border-color:var(--accent); background:#f6f9ff; }
    .caserow .cr-top { display:flex; gap:8px; align-items:center; flex-wrap:wrap; font-size:.78rem; color:var(--muted); }
    .tag { background:#eef1f5; border-radius:20px; padding:1px 9px; font-weight:600; }
    .tag.office { background:#e8eefc; color:var(--accent); }
    .caserow .cr-model { font-weight:800; color:var(--accent); font-size:1rem; margin:4px 0 2px; }
    .caserow .cr-sym { font-size:.9rem; color:#374050; }
    .empty { color:var(--muted); padding:16px 4px; font-size:.92rem; text-align:center; }

    /* 모달 */
    .modal { display:none; position:fixed; inset:0; background:rgba(15,20,32,.5); z-index:9000; overflow:auto; padding:16px; }
    .modal.open { display:block; }
    .sheet { max-width:860px; margin:24px auto; background:#fff; border-radius:14px; padding:20px 22px; }
    .sheet-head { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:14px; }
    .sheet-head h2 { margin:0; font-size:1.1rem; }
    .x { background:#eef1f5; color:#333; border-radius:8px; padding:8px 14px; }
    .section-title { font-size:.82rem; font-weight:700; color:var(--muted); margin:18px 0 8px; border-top:1px dashed var(--line); padding-top:14px; }
    details.more > summary { cursor:pointer; font-weight:700; color:var(--accent); font-size:.9rem; padding:10px 0; list-style:none; }
    details.more > summary::before { content:"▸ "; }
    details.more[open] > summary::before { content:"▾ "; }
    .row-btns { display:flex; gap:10px; flex-wrap:wrap; margin-top:18px; }
    #status, #fstatus { font-size:.86rem; color:var(--muted); min-height:1.2em; margin-top:10px; }
    .ok { color:#067d3b; } .err { color:#b3261e; }
    .thumbs { display:grid; grid-template-columns:repeat(auto-fill,minmax(110px,1fr)); gap:10px; margin-top:10px; }

    /* 상세 뷰 */
    .dv-field { margin:10px 0; }
    .dv-field .k { font-size:.74rem; color:var(--muted); font-weight:700; }
    .dv-field .v { font-size:.98rem; white-space:pre-wrap; margin-top:2px; }
    .dv-meta { display:flex; gap:8px; flex-wrap:wrap; font-size:.82rem; color:var(--muted); margin-bottom:6px; }
    .core { background:#f7faff; border:1px solid #dce8ff; border-radius:8px; padding:10px 12px; }
  </style>
</head>
<body>
  <div id="pinGate" style="position:fixed;inset:0;background:#0e1420;z-index:9999;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;color:#e6ebf2;padding:20px;text-align:center">
    <div style="font-size:1.3rem;font-weight:700">🔧 고장·정비 사례</div>
    <div style="color:#8a94a3;font-size:.9rem">접속 PIN을 입력하세요</div>
    <input id="pinInput" type="password" inputmode="numeric" maxlength="12" placeholder="PIN"
           style="font-size:1.4rem;text-align:center;letter-spacing:.25em;padding:10px 16px;border-radius:8px;border:1px solid #2a3550;background:#182130;color:#fff;width:200px" />
    <button id="pinOk" style="background:#2f6fed;color:#fff;padding:11px 28px;font-size:1rem">확인</button>
    <div id="pinErr" style="color:#ff6b6b;font-size:.85rem;height:1.1em"></div>
  </div>

  <div class="topbar">
    <div class="topbar-inner">
      <div class="brand">🔧 고장·정비 사례<small>KBS 전국 공용 지식DB</small></div>
      <div class="tb-actions">
        <button class="primary" id="openNew" style="padding:9px 16px">➕ 새 사례 등록</button>
        <a href="index.html">📋 일일업무일지</a>
      </div>
    </div>
  </div>

  <main>
    <div class="card">
      <div class="searchrow">
        <div class="q"><label>🔍 모델명 · 증상 · 장비 검색</label><input id="q" placeholder="예: PCU-2000, 출력저하, TX-B …" /></div>
        <div class="f"><label>소속국</label><select id="fOffice"></select></div>
        <div class="f"><label>송신소</label><select id="fSite"></select></div>
        <div class="f"><label>장비</label><input id="fEquip" list="equipList" placeholder="전체" /></div>
        <button class="primary" id="searchBtn">검색</button>
        <button class="ghost" id="resetSearch">전체</button>
      </div>
    </div>

    <div class="card">
      <h2>등록된 사례 <span id="count" style="color:var(--muted);font-weight:400;font-size:.85rem"></span></h2>
      <div id="results"><div class="empty">불러오는 중…</div></div>
    </div>

    <datalist id="equipList"></datalist>
  </main>

  <!-- 상세 열람 모달 -->
  <div class="modal" id="detailModal">
    <div class="sheet">
      <div class="sheet-head">
        <h2 id="dvTitle">사례 상세</h2>
        <button class="x" data-close>닫기</button>
      </div>
      <div id="dvBody"></div>
      <div class="row-btns">
        <button class="blue" id="dvReport">📄 장애보고서 다운로드</button>
        <button class="ghost" id="dvEdit">✏️ 수정</button>
        <button class="danger" id="dvDelete">🗑 삭제</button>
      </div>
      <div id="status"></div>
    </div>
  </div>

  <!-- 등록/수정 폼 모달 -->
  <div class="modal" id="formModal">
    <div class="sheet">
      <div class="sheet-head">
        <h2 id="formTitle">➕ 새 사례 등록</h2>
        <button class="x" data-close>닫기</button>
      </div>

      <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr))">
        <div><label>소속국</label><select id="office"></select></div>
        <div><label>송신소</label><select id="site"></select></div>
        <div><label>장비 종류</label><input id="equip_type" list="equipList" placeholder="예: 송신기" /></div>
        <div><label>모델명 ★</label><input id="model" placeholder="예: THU9evo(R&S)" /></div>
        <div><label>날짜</label><input type="date" id="fault_date" /></div>
      </div>

      <div class="section-title">핵심 내용</div>
      <div class="core">
        <div style="margin-bottom:10px"><label>증상 ★</label><textarea id="symptom" placeholder="고장·이상 증상 (검색됨)"></textarea></div>
        <div style="margin-bottom:10px"><label>조치</label><textarea id="action" placeholder="어떻게 조치했는지"></textarea></div>
        <div><label>향후계획</label><textarea id="plan" placeholder="예: R&S에 예비 부품 구입 후 보관"></textarea></div>
      </div>

      <details class="more">
        <summary>부가 정보 (장비명·세부·작성자·제목)</summary>
        <div class="grid" style="grid-template-columns:1fr 1fr">
          <div style="grid-column:1/-1"><label>장비명 (상세)</label><input id="equipment" placeholder="예: 2TV(CH32, 1kW) TX-B" /></div>
          <div style="grid-column:1/-1"><label>세부 1</label><input id="detail1" placeholder="예: 호스 제작사/가격 - 동양고압호스 / 30,000원" /></div>
          <div style="grid-column:1/-1"><label>세부 2</label><input id="detail2" placeholder="예: 가스켓 - 경진산업 / 10,000원" /></div>
          <div><label>작성자</label><input id="authors" placeholder="예: 이대로,조기은" /></div>
          <div><label>부서(머리글)</label><input id="dept" placeholder="국 선택 시 자동" /></div>
          <div style="grid-column:1/-1"><label>보고서 제목 (비우면 자동)</label><input id="title" placeholder="예: 계룡산(송) 2TV 냉각호스 누수" /></div>
        </div>
      </details>

      <details class="more">
        <summary>📷 사진 (최대 8장 · 앞 4장=소제목1, 다음 4장=소제목2)</summary>
        <div class="grid" style="grid-template-columns:1fr 1fr">
          <div><label>소제목1 (사진 1~4)</label><input id="sub1" placeholder="예: 누수 및 분리" /></div>
          <div><label>소제목2 (사진 5~8)</label><input id="sub2" placeholder="예: 제작 및 교체" /></div>
        </div>
        <input type="file" id="photoInput" accept="image/*" multiple style="margin-top:10px" />
        <div id="thumbs" class="thumbs"></div>
      </details>

      <div class="row-btns">
        <button class="primary" id="saveBtn">💾 등록</button>
        <button class="blue" id="reportBtn">📄 장애보고서 다운로드</button>
        <button class="danger" id="delBtn" style="display:none">🗑 삭제</button>
      </div>
      <div id="fstatus"></div>
    </div>
  </div>

  <script type="module">
    import { saveCase, updateCase, deleteCase, getCase, searchCases } from "./faultCases.js";
    import { buildFaultReport } from "./faultReport.js";
    import { downloadBlob } from "./hwpx.js";
    import { OFFICE_LIST, OFFICES } from "./sites.js";
    import { compressImage } from "./photo.js";
    import { uploadPhoto, photoUrl, removePhoto, fetchPhotoBytes } from "./photoStorage.js";

    const APP_PIN = "7590";
    (function () {
      const gate = document.getElementById("pinGate");
      if (localStorage.getItem("ilji_pin_ok") === APP_PIN) { gate.remove(); return; }
      const inp = document.getElementById("pinInput"), err = document.getElementById("pinErr");
      const tryPin = () => { if (inp.value === APP_PIN) { localStorage.setItem("ilji_pin_ok", APP_PIN); gate.remove(); } else { err.textContent = "PIN이 틀렸어요"; inp.value = ""; inp.focus(); } };
      document.getElementById("pinOk").addEventListener("click", tryPin);
      inp.addEventListener("keydown", (e) => { if (e.key === "Enter") tryPin(); });
      inp.focus();
    })();

    const EQUIP_TYPES = ["송신기", "엑사이터", "중계기", "기타"];
    const $ = (id) => document.getElementById(id);
    const esc = (s) => (s || "").replace(/</g, "&lt;");
    const setStatus = (m, c) => { $("status").textContent = m; $("status").className = c || ""; };
    const setFStatus = (m, c) => { $("fstatus").textContent = m; $("fstatus").className = c || ""; };

    function fillOffices(sel, withAll) { sel.innerHTML = (withAll ? `<option value="">전체</option>` : "") + OFFICE_LIST.map((o) => `<option>${o}</option>`).join(""); }
    function fillSites(sel, office, withAll) { const s = OFFICES[office] || []; sel.innerHTML = (withAll ? `<option value="">전체</option>` : `<option value="">(송신소)</option>`) + s.map((x) => `<option>${x}</option>`).join(""); }
    $("equipList").innerHTML = EQUIP_TYPES.map((e) => `<option value="${e}">`).join("");
    fillOffices($("fOffice"), true); fillSites($("fSite"), "", true);
    $("fOffice").addEventListener("change", () => fillSites($("fSite"), $("fOffice").value, true));
    fillOffices($("office"), false); fillSites($("site"), OFFICE_LIST[0], false);
    const deptDefault = (o) => (o === "본사" ? "본사 기술국" : `${o}방송총국 기술국`);
    function maybeUpdateDept() { const d = $("dept").value.trim(); if (!d || /방송총국 기술국$/.test(d) || d === "본사 기술국") $("dept").value = deptDefault($("office").value); }
    $("office").addEventListener("change", () => { fillSites($("site"), $("office").value, false); maybeUpdateDept(); });

    // 모달 열고닫기
    function openModal(id) { $(id).classList.add("open"); }
    function closeModal(id) { $(id).classList.remove("open"); }
    for (const m of document.querySelectorAll(".modal")) {
      m.addEventListener("click", (e) => { if (e.target === m || e.target.hasAttribute("data-close")) m.classList.remove("open"); });
    }

    // ===== 검색·목록 =====
    async function doSearch() {
      $("results").innerHTML = `<div class="empty">불러오는 중…</div>`;
      try {
        const rows = await searchCases({ q: $("q").value, office: $("fOffice").value, site: $("fSite").value, equip_type: $("fEquip").value });
        renderList(rows);
      } catch (e) { $("results").innerHTML = `<div class="empty err">검색 오류: ${esc(e.message)}<br>(fault_cases 테이블 만드셨나요?)</div>`; }
    }
    function renderList(rows) {
      $("count").textContent = `(${rows.length}건)`;
      const box = $("results");
      if (!rows.length) { box.innerHTML = `<div class="empty">사례가 없어요. 우측 상단 <b>➕ 새 사례 등록</b>으로 추가하세요.</div>`; return; }
      box.innerHTML = rows.map((r) => `
        <div class="caserow" data-id="${r.id}">
          <div class="cr-top">
            <span class="tag office">${esc(r.office || "")}</span>
            <span class="tag">${esc(r.site || "")}</span>
            ${r.equip_type ? `<span class="tag">${esc(r.equip_type)}</span>` : ""}
            <span style="margin-left:auto">${esc(r.fault_date || "")}</span>
          </div>
          <div class="cr-model">${esc(r.model || r.equipment || "(모델 미입력)")}</div>
          <div class="cr-sym">${esc((r.symptom || "").slice(0, 60))}</div>
        </div>`).join("");
      for (const el of box.querySelectorAll(".caserow")) el.addEventListener("click", () => openDetail(+el.dataset.id));
    }
    $("searchBtn").addEventListener("click", doSearch);
    $("q").addEventListener("keydown", (e) => { if (e.key === "Enter") doSearch(); });
    $("resetSearch").addEventListener("click", () => { $("q").value = ""; fillOffices($("fOffice"), true); fillSites($("fSite"), "", true); $("fEquip").value = ""; doSearch(); });

    // ===== 상세 열람 =====
    let detailCase = null;
    async function openDetail(id) {
      try {
        const c = await getCase(id); if (!c) return;
        detailCase = c;
        $("dvTitle").textContent = c.title || `${c.site || ""} ${c.model || ""}`.trim() || "사례 상세";
        const dv = (k, v) => v ? `<div class="dv-field"><div class="k">${k}</div><div class="v">${esc(v)}</div></div>` : "";
        let photosHtml = "";
        if ((c.photos || []).length) photosHtml = `<div class="dv-field"><div class="k">사진 (${c.photos.length}장)</div><div class="thumbs">${c.photos.map((p) => `<img src="${photoUrl(p.path)}" style="width:100%;height:90px;object-fit:cover;border-radius:6px;border:1px solid var(--line)" title="${esc(p.caption || "")}"/>`).join("")}</div></div>`;
        $("dvBody").innerHTML = `
          <div class="dv-meta"><b style="color:var(--accent)">${esc(c.office || "")}</b> · ${esc(c.site || "")} · ${esc(c.equip_type || "")} · ${esc(c.fault_date || "")}</div>
          <div class="dv-field"><div class="k">모델명</div><div class="v" style="font-weight:800;color:var(--accent)">${esc(c.model || "-")}</div></div>
          ${dv("장비명", c.equipment)}
          <div class="core" style="margin:12px 0">
            ${dv("증상", c.symptom)}${dv("조치", c.action)}${dv("향후계획", c.plan)}
          </div>
          ${dv("세부 1", c.detail1)}${dv("세부 2", c.detail2)}${dv("작성자", c.authors)}
          ${photosHtml}`;
        openModal("detailModal");
        setStatus("");
      } catch (e) { alert("불러오기 오류: " + e.message); }
    }
    $("dvEdit").addEventListener("click", () => { if (detailCase) { closeModal("detailModal"); loadIntoForm(detailCase); } });
    $("dvDelete").addEventListener("click", async () => {
      if (!detailCase) return;
      if (!confirm("이 사례를 삭제할까요?")) return;
      try { await deleteCase(detailCase.id); closeModal("detailModal"); doSearch(); } catch (e) { setStatus("삭제 오류: " + e.message, "err"); }
    });
    $("dvReport").addEventListener("click", () => detailCase && downloadReport(detailCase, "dv"));

    // ===== 폼 =====
    let currentId = null;
    let photos = [], photoSeq = 0;
    const FORM_FIELDS = ["office", "dept", "site", "equip_type", "fault_date", "equipment", "model", "authors", "symptom", "action", "plan", "detail1", "detail2", "title", "sub1", "sub2"];

    function renderThumbs() {
      const box = $("thumbs"); box.innerHTML = "";
      photos.forEach((item, idx) => {
        const src = item.url || (item.file ? URL.createObjectURL(item.file) : "");
        const el = document.createElement("div"); el.style.cssText = "position:relative";
        el.innerHTML = `<div style="position:relative"><img src="${src}" style="width:100%;height:82px;object-fit:cover;border-radius:5px;border:1px solid var(--line)${item.uploading ? ";opacity:.4" : ""}" />
          <span style="position:absolute;top:2px;left:2px;background:var(--accent);color:#fff;font-size:.66rem;font-weight:700;padding:1px 6px;border-radius:4px">${idx + 1}</span>
          ${item.uploading ? '<span style="position:absolute;bottom:2px;left:2px;background:rgba(0,0,0,.65);color:#fff;font-size:.6rem;padding:1px 5px;border-radius:4px">올리는중…</span>' : ""}
          <button title="삭제" style="position:absolute;top:2px;right:2px;background:rgba(0,0,0,.6);color:#fff;border:0;border-radius:50%;width:20px;height:20px;cursor:pointer;font-size:.7rem;padding:0">×</button></div>
          <input type="text" placeholder="캡션" value="${(item.caption || "").replace(/"/g, "&quot;")}" style="width:100%;margin-top:4px;font-size:.72rem;padding:4px" />`;
        el.querySelector("input").addEventListener("input", (e) => { item.caption = e.target.value; });
        el.querySelector("button").addEventListener("click", async () => { if (item.path) { try { await removePhoto(item.path); } catch (e) {} } const i = photos.indexOf(item); if (i >= 0) photos.splice(i, 1); renderThumbs(); });
        box.appendChild(el);
      });
    }
    $("photoInput").addEventListener("change", async (e) => {
      const files = [...e.target.files]; e.target.value = "";
      for (const f of files) {
        if (photos.length >= 8) { setFStatus("사진은 최대 8장입니다.", "err"); break; }
        const item = { id: ++photoSeq, file: f, caption: "", uploading: true }; photos.push(item); renderThumbs();
        try { const c = await compressImage(f); const path = `fault/${item.id}_${Date.now()}.jpg`; await uploadPhoto(path, c.bytes);
          item.path = path; item.w = c.w; item.h = c.h; item.url = photoUrl(path); item.uploading = false; renderThumbs();
        } catch (err) { item.uploading = false; setFStatus("사진 업로드 실패: " + err.message + " (photos 버킷 필요)", "err"); renderThumbs(); }
      }
    });

    function readForm() { const c = {}; for (const f of FORM_FIELDS) c[f] = $(f).value || null; return c; }
    function clearForm() {
      currentId = null;
      for (const f of FORM_FIELDS) $(f).value = "";
      $("office").value = OFFICE_LIST[0]; fillSites($("site"), OFFICE_LIST[0], false);
      $("dept").value = deptDefault($("office").value);
      $("fault_date").value = new Date().toISOString().slice(0, 10);
      photos = []; renderThumbs();
      $("formTitle").textContent = "➕ 새 사례 등록"; $("saveBtn").textContent = "💾 등록"; $("delBtn").style.display = "none";
      setFStatus("");
    }
    function loadIntoForm(c) {
      currentId = c.id;
      fillSites($("site"), c.office || OFFICE_LIST[0], false);
      for (const f of FORM_FIELDS) $(f).value = c[f] || "";
      if (c.office) $("office").value = c.office;
      if (c.site) $("site").value = c.site;
      if (!$("dept").value.trim()) $("dept").value = deptDefault($("office").value);
      photos = (c.photos || []).map((p) => ({ id: ++photoSeq, caption: p.caption || "", path: p.path, w: p.w, h: p.h, url: photoUrl(p.path) }));
      renderThumbs();
      $("formTitle").textContent = "✏️ 사례 수정"; $("saveBtn").textContent = "💾 수정 저장"; $("delBtn").style.display = "";
      setFStatus(""); openModal("formModal");
    }
    const autoTitle = (c) => c.title || [c.site, c.equipment || c.equip_type, c.symptom].filter(Boolean).join(" ").slice(0, 60);

    $("openNew").addEventListener("click", () => { clearForm(); openModal("formModal"); });
    $("saveBtn").addEventListener("click", async (e) => {
      const c = readForm();
      if (!c.office || !c.site) { setFStatus("소속국·송신소를 선택하세요.", "err"); return; }
      c.title = autoTitle(c);
      c.photos = photos.filter((p) => p.path).map((p) => ({ path: p.path, caption: p.caption || "", w: p.w, h: p.h }));
      e.currentTarget.disabled = true; setFStatus("저장 중…");
      try {
        if (currentId) { await updateCase(currentId, c); setFStatus(`✅ #${currentId} 수정 완료`, "ok"); }
        else { const s = await saveCase(c); currentId = s.id; $("formTitle").textContent = "✏️ 사례 수정"; $("saveBtn").textContent = "💾 수정 저장"; $("delBtn").style.display = ""; setFStatus(`✅ 등록 완료 (#${s.id})`, "ok"); }
        doSearch();
      } catch (err) { setFStatus("저장 오류: " + err.message + " (fault_cases 테이블 필요)", "err"); }
      finally { e.currentTarget.disabled = false; }
    });
    $("delBtn").addEventListener("click", async () => {
      if (!currentId || !confirm("이 사례를 삭제할까요?")) return;
      try { await deleteCase(currentId); closeModal("formModal"); doSearch(); } catch (e) { setFStatus("삭제 오류: " + e.message, "err"); }
    });
    $("reportBtn").addEventListener("click", () => { const c = readForm(); c.id = currentId; c.photos = photos; downloadReport(c, "form"); });

    async function downloadReport(c, where) {
      const st = where === "dv" ? setStatus : setFStatus;
      st("보고서 생성 중…");
      try {
        const plist = (c.photos || []).filter((p) => p.path);
        const withBytes = [];
        for (let i = 0; i < plist.length; i++) { st(`사진 불러오는 중… (${i + 1}/${plist.length})`); withBytes.push({ idref: "fp" + i, bytes: await fetchPhotoBytes(plist[i].path), w: plist[i].w, h: plist[i].h, caption: plist[i].caption }); }
        st("보고서 생성 중…");
        const d = (c.fault_date || "").replace(/-/g, ".");
        const title = c.title || autoTitle(c);
        const blob = await buildFaultReport({ ...c, title, fault_date: d }, withBytes);
        downloadBlob(blob, `장애보고서_${(c.site || "")}_${(c.model || c.equip_type || "")}.hwpx`);
        st(`✅ 장애보고서 다운로드${withBytes.length ? ` (사진 ${withBytes.length}장)` : ""}`, "ok");
      } catch (err) { st("보고서 오류: " + err.message, "err"); }
    }

    clearForm();
    doSearch();
  </script>
</body>
</html>
