name: Supabase keep-alive

# 무료 플랜 자동 일시정지(약 7일 미사용) 방지용.
# 매일 1회 Supabase 테이블을 1건 조회해 프로젝트를 Active 상태로 유지한다.
# (publishable 키는 이미 공개 키이므로 그대로 사용)

on:
  schedule:
    - cron: "17 21 * * *"   # 매일 21:17 UTC = 06:17 KST
  workflow_dispatch:          # Actions 탭에서 수동 실행 가능

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST (keep project active)
        run: |
          URL="https://corgddhyokbylsfdclps.supabase.co/rest/v1/fault_cases?select=id&limit=1"
          KEY="sb_publishable_OVLf_f8LN0gRZlR-8eGTdA_v6DxLLjb"
          echo "Pinging Supabase..."
          code=$(curl -s -m 30 -o /tmp/resp.txt -w "%{http_code}" "$URL" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          echo "HTTP status: $code"
          echo "Response: $(head -c 200 /tmp/resp.txt)"
          if [ "$code" = "200" ]; then
            echo "✅ keep-alive OK — 프로젝트 Active 유지"
          else
            echo "⚠️ 예상과 다른 응답($code). 프로젝트가 일시정지 상태이거나 오류일 수 있음."
            exit 1
          fi
