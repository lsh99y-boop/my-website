<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>일일업무일지 작성</title>
  <style>
    :root { --line:#d7dbe0; --bg:#f6f8fa; --accent:#2f6fed; }
    * { box-sizing: border-box; }
    body { font-family: system-ui, "Malgun Gothic", sans-serif; margin: 0; background: var(--bg); color: #1a2230; }
    header { background: #fff; border-bottom: 1px solid var(--line); padding: 16px 20px; }
    header h1 { font-size: 1.15rem; margin: 0; }
    header p { margin: 4px 0 0; color: #667; font-size: .85rem; }
    main { max-width: 900px; margin: 22px auto; padding: 0 16px 60px; }
    .card { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 18px; margin-bottom: 16px; }
    .row { display: flex; gap: 14px; flex-wrap: wrap; align-items: end; }
    .field { display: flex; flex-direction: column; gap: 5px; }
    label { font-size: .82rem; color: #445; font-weight: 600; }
    input, textarea { font: inherit; border: 1px solid var(--line); border-radius: 7px; padding: 8px 10px; background: #fff; }
    input:focus, textarea:focus { outline: 2px solid var(--accent); border-color: var(--accent); }
    textarea { width: 100%; min-height: 70px; resize: vertical; line-height: 1.5; }
    .facility { margin-bottom: 12px; }
    .facility label { display: block; margin-bottom: 5px; font-size: .9rem; color: #1a2230; }
    .facility .hint { color: #8a94a3; font-weight: 400; font-size: .78rem; }
    .bar { position: sticky; bottom: 0; background: #fff; border-top: 1px solid var(--line);
           padding: 14px 16px; display: flex; gap: 12px; align-items: center; justify-content: flex-end; }
    button { font: inherit; font-weight: 600; border: 0; border-radius: 8px; padding: 11px 20px; cursor: pointer; }
    .primary { background: var(--accent); color: #fff; }
    .primary:disabled { opacity: .5; cursor: default; }
    #status { margin-right: auto; font-size: .88rem; color: #667; }
    #status.ok { color: #067d3b; } #status.err { color: #b3261e; }
  </style>
</head>
<body>
  <header>
    <h1>📋 일일업무일지 작성</h1>
    <p>대전총국 송출센터 · 입력 후 한글파일(.hwpx)로 다운로드</p>
  </header>

  <main>
    <div class="card">
      <div class="row">
        <div class="field">
          <label for="date">날짜</label>
          <input type="date" id="date" />
        </div>
        <div class="field">
          <label for="weekday">요일</label>
          <input type="text" id="weekday" style="width:70px" readonly />
        </div>
        <div class="field" style="flex:1; min-width:160px">
          <label for="weather">날씨</label>
          <input type="text" id="weather" placeholder="예: 맑음" />
        </div>
      </div>
    </div>

    <div class="card" id="facilities">
      <!-- 업무구분 8칸 -->
    </div>

    <div class="card">
      <label>📷 사진 <span style="color:#8a94a3;font-weight:400;font-size:.8rem">(선택 · 여러 장 · 업로드 시 자동으로 KB 단위 압축 · 4열 격자로 삽입)</span></label>
      <div style="margin-top:8px">
        <input type="file" id="photoInput" accept="image/*" multiple />
      </div>
      <div id="photoList" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:14px"></div>
    </div>
  </main>

  <div class="bar">
    <span id="status"></span>
    <button class="primary" id="download">한글파일 다운로드</button>
  </div>

  <script type="module">
    import { buildHwpx, downloadBlob } from "./hwpx.js";
    import { compressImage } from "./photo.js";

    const FACILITIES = [
      ["C_song",   "송출기술"],
      ["C_tvram",  "TVR / AM"],
      ["C_gr",     "계룡산(송)"],
      ["C_sj",     "식장산(중)"],
      ["C_hs",     "흑성산(중)"],
      ["C_wh",     "원효봉(중)"],
      ["C_minwon", "민원사항"],
      ["C_teuki",  "특기사항"],
    ];
    const WD = ["일","월","화","수","목","금","토"];

    // 시설 입력칸 생성
    const fc = document.getElementById("facilities");
    for (const [key, label] of FACILITIES) {
      const div = document.createElement("div");
      div.className = "facility";
      div.innerHTML = `<label>${label} <span class="hint">(여러 줄 입력 가능 · 빈칸은 ◎만 표시)</span></label>
        <textarea data-key="${key}" placeholder="업무 추진 내용..."></textarea>`;
      fc.appendChild(div);
    }

    // 날짜 → 요일 자동
    const dateEl = document.getElementById("date");
    const wdEl = document.getElementById("weekday");
    function syncWeekday() {
      if (!dateEl.value) { wdEl.value = ""; return; }
      const d = new Date(dateEl.value + "T00:00:00");
      wdEl.value = WD[d.getDay()];
    }
    dateEl.addEventListener("change", syncWeekday);
    // 기본값: 오늘
    dateEl.value = new Date().toISOString().slice(0, 10);
    syncWeekday();

    // ---- 사진 관리 ----
    let photoSeq = 0;
    const photoItems = []; // {id, file, caption}
    const photoList = document.getElementById("photoList");
    const photoInput = document.getElementById("photoInput");

    function renderPhotos() {
      photoList.innerHTML = "";
      for (const item of photoItems) {
        const box = document.createElement("div");
        box.style.cssText = "border:1px solid #d7dbe0;border-radius:8px;padding:8px;background:#fafbfc";
        const url = URL.createObjectURL(item.file);
        box.innerHTML = `
          <img src="${url}" style="width:100%;height:100px;object-fit:cover;border-radius:5px" />
          <input type="text" placeholder="사진 설명(캡션)" value="${item.caption.replace(/"/g,'&quot;')}"
                 style="width:100%;margin-top:6px;font-size:.8rem;padding:5px;border:1px solid #d7dbe0;border-radius:5px" />
          <button style="margin-top:6px;width:100%;background:#eee;color:#b3261e;font-size:.78rem;padding:5px">삭제</button>`;
        box.querySelector("input").addEventListener("input", (e) => { item.caption = e.target.value; });
        box.querySelector("button").addEventListener("click", () => {
          const i = photoItems.indexOf(item);
          if (i >= 0) photoItems.splice(i, 1);
          renderPhotos();
        });
        photoList.appendChild(box);
      }
    }
    photoInput.addEventListener("change", (e) => {
      for (const f of e.target.files) photoItems.push({ id: ++photoSeq, file: f, caption: "" });
      photoInput.value = "";
      renderPhotos();
    });

    const status = document.getElementById("status");
    function setStatus(msg, cls) { status.textContent = msg; status.className = cls || ""; }

    document.getElementById("download").addEventListener("click", async (e) => {
      const btn = e.currentTarget;
      if (!dateEl.value) { setStatus("날짜를 선택하세요.", "err"); return; }
      const [Y, M, D] = dateEl.value.split("-");
      const data = {
        MM: M, DD: D, WD: wdEl.value, WX: document.getElementById("weather").value,
      };
      for (const ta of document.querySelectorAll("textarea[data-key]"))
        data[ta.dataset.key] = ta.value;

      btn.disabled = true;
      try {
        // 사진 압축
        const photos = [];
        for (let i = 0; i < photoItems.length; i++) {
          setStatus(`사진 압축 중… (${i + 1}/${photoItems.length})`);
          const c = await compressImage(photoItems[i].file);
          photos.push({ idref: "photo" + photoItems[i].id, bytes: c.bytes, w: c.w, h: c.h, caption: photoItems[i].caption });
        }
        setStatus("한글파일 생성 중…");
        const blob = await buildHwpx(data, photos);
        const fname = `일일업무일지_${Y}년${M}월${D}일.hwpx`;
        downloadBlob(blob, fname);
        const kb = photos.reduce((s, p) => s + p.bytes.length, 0) / 1024;
        setStatus(`✅ 다운로드 완료: ${fname}` + (photos.length ? ` (사진 ${photos.length}장, ${kb.toFixed(0)}KB)` : ""), "ok");
      } catch (err) {
        console.error(err);
        setStatus("❌ 오류: " + err.message, "err");
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
