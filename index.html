<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>일일업무일지 작성</title>
  <style>
    :root { --line:#d7dbe0; --bg:#f6f8fa; --accent:#2f6fed; }
    * { box-sizing: border-box; }
    body { font-family: system-ui, "Malgun Gothic", sans-serif; margin: 0; background: var(--bg); color: #1a2230; }
    header { background: #fff; border-bottom: 1px solid var(--line); padding: 16px 20px; }
    header h1 { font-size: 1.15rem; margin: 0; }
    header p { margin: 4px 0 0; color: #667; font-size: .85rem; }
    main { max-width: 900px; margin: 22px auto; padding: 0 16px 60px; }
    .card { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 18px; margin-bottom: 16px; }
    .row { display: flex; gap: 14px; flex-wrap: wrap; align-items: end; }
    .field { display: flex; flex-direction: column; gap: 5px; }
    label { font-size: .82rem; color: #445; font-weight: 600; }
    input, textarea { font: inherit; border: 1px solid var(--line); border-radius: 7px; padding: 8px 10px; background: #fff; }
    input:focus, textarea:focus { outline: 2px solid var(--accent); border-color: var(--accent); }
    textarea { width: 100%; min-height: 70px; resize: vertical; line-height: 1.5; }
    .facility { margin-bottom: 12px; }
    .facility label { display: block; margin-bottom: 5px; font-size: .9rem; color: #1a2230; }
    .facility .hint { color: #8a94a3; font-weight: 400; font-size: .78rem; }
    .bar { position: sticky; bottom: 0; background: #fff; border-top: 1px solid var(--line);
           padding: 14px 16px; display: flex; gap: 12px; align-items: center; justify-content: flex-end; }
    button { font: inherit; font-weight: 600; border: 0; border-radius: 8px; padding: 11px 20px; cursor: pointer; }
    .primary { background: var(--accent); color: #fff; }
    .primary:disabled { opacity: .5; cursor: default; }
    #status { margin-right: auto; font-size: .88rem; color: #667; }
    #status.ok { color: #067d3b; } #status.err { color: #b3261e; }
  </style>
</head>
<body>
  <div id="pinGate" style="position:fixed;inset:0;background:#0e1420;z-index:9999;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;color:#e6ebf2;font-family:system-ui,'Malgun Gothic',sans-serif;padding:20px;text-align:center">
    <div style="font-size:1.3rem;font-weight:700">📋 일일업무일지</div>
    <div style="color:#8a94a3;font-size:.9rem">접속 PIN을 입력하세요</div>
    <input id="pinInput" type="password" inputmode="numeric" maxlength="12" placeholder="PIN"
           style="font-size:1.4rem;text-align:center;letter-spacing:.25em;padding:10px 16px;border-radius:8px;border:1px solid #2a3550;background:#182130;color:#fff;width:200px" />
    <button id="pinOk" style="background:#2f6fed;color:#fff;border:0;border-radius:8px;padding:11px 28px;font-weight:600;cursor:pointer;font-size:1rem">확인</button>
    <div id="pinErr" style="color:#ff6b6b;font-size:.85rem;height:1.1em"></div>
  </div>

  <header style="display:flex;justify-content:space-between;align-items:center;gap:12px">
    <div>
      <h1>📋 일일업무일지 작성</h1>
      <p>대전 정비팀 · 입력 후 한글파일(.hwpx)로 다운로드</p>
    </div>
    <a href="help.html" style="color:#2f6fed;text-decoration:none;font-weight:600;font-size:.88rem;white-space:nowrap;border:1px solid #cfdcfb;border-radius:8px;padding:8px 12px">📖 사용법</a>
  </header>

  <main>
    <div class="card">
      <div class="row">
        <div class="field">
          <label for="date">날짜</label>
          <input type="date" id="date" />
        </div>
        <div class="field">
          <label for="weekday">요일</label>
          <input type="text" id="weekday" style="width:70px" readonly />
        </div>
        <div class="field" style="flex:1; min-width:160px">
          <label for="weather">날씨</label>
          <input type="text" id="weather" placeholder="예: 맑음" />
        </div>
      </div>
      <div id="dateWarn" style="display:none;margin-top:12px;background:#fff6e6;border-left:4px solid #e0a800;padding:9px 13px;border-radius:6px;font-size:.85rem;color:#8a6d00">⚠️ <b>오늘 날짜가 아닙니다.</b> 과거·미래 날짜에 작성 중이에요 — 저장할 때 한 번 더 확인합니다.</div>
    </div>

    <div id="facilities">
      <!-- 시설별 카드(내용 + 사진) -->
    </div>

    <div class="card" style="display:flex;gap:12px;align-items:end;flex-wrap:wrap">
      <div class="field">
        <label for="month">📅 한 달치 다운로드</label>
        <input type="month" id="month" />
      </div>
      <button id="monthDownload" style="background:#e8eefc;color:#2f6fed;font-weight:600;border:0;border-radius:8px;padding:10px 18px;cursor:pointer">이 달 전체 한글파일</button>
      <span style="color:#8a94a3;font-size:.78rem">저장된 날들을 날짜순으로 한 파일에 모아요 (텍스트)</span>
    </div>
  </main>

  <div class="bar">
    <span id="status"></span>
    <button id="save" style="background:#e8eefc;color:#2f6fed">💾 저장</button>
    <button class="primary" id="download">한글파일 다운로드</button>
  </div>

  <script type="module">
    import { buildHwpx, buildMonthHwpx, downloadBlob } from "./hwpx.js";
    import { compressImage } from "./photo.js";
    import { saveLog, loadLog, cleanupOld, listMonth } from "./storage.js";
    import { uploadPhoto, photoUrl, removePhoto, fetchPhotoBytes } from "./photoStorage.js";

    // ===== 접속 PIN (팀 공용) =====
    const APP_PIN = "7590"; // ← 팀 공용 PIN
    (function pinGate() {
      const gate = document.getElementById("pinGate");
      if (localStorage.getItem("ilji_pin_ok") === APP_PIN) { gate.remove(); return; }
      const inp = document.getElementById("pinInput");
      const err = document.getElementById("pinErr");
      const tryPin = () => {
        if (inp.value === APP_PIN) { localStorage.setItem("ilji_pin_ok", APP_PIN); gate.remove(); }
        else { err.textContent = "PIN이 틀렸어요"; inp.value = ""; inp.focus(); }
      };
      document.getElementById("pinOk").addEventListener("click", tryPin);
      inp.addEventListener("keydown", (e) => { if (e.key === "Enter") tryPin(); });
      inp.focus();
    })();

    const FACILITIES = [
      ["C_song",   "송출기술"],
      ["C_tvram",  "TVR / AM"],
      ["C_gr",     "계룡산(송)"],
      ["C_sj",     "식장산(중)"],
      ["C_hs",     "흑성산(중)"],
      ["C_wh",     "원효봉(중)"],
      ["C_minwon", "민원사항"],
      ["C_teuki",  "특기사항"],
    ];
    const WD = ["일","월","화","수","목","금","토"];

    // 시설별 사진 저장 {key: [{id, file}]}
    const photosByKey = {};
    let photoSeq = 0;
    const touched = new Set();   // 이번에 내가 편집한 시설(이것만 저장 시 덮어씀)
    let weatherTouched = false;  // 날씨를 내가 바꿨나

    // 시설 카드 생성 (내용 textarea + 사진 업로드)
    const fc = document.getElementById("facilities");
    for (const [key, label] of FACILITIES) {
      photosByKey[key] = [];
      const div = document.createElement("div");
      div.className = "card";
      div.innerHTML = `
        <label>${label} <span class="hint" style="color:#8a94a3;font-weight:400;font-size:.78rem">(여러 줄 가능 · 빈칸은 ◎만 표시)</span></label>
        <textarea data-key="${key}" placeholder="업무 추진 내용...  (중간에 사진을 넣으려면 [사진1] 처럼 입력)" style="margin-top:6px"></textarea>
        <div style="margin-top:10px">
          <span style="font-size:.8rem;color:#556;font-weight:600">📷 사진</span>
          <span class="hint" style="color:#8a94a3;font-size:.75rem">(선택 · 여러 장 · 자동 KB압축 · 마커 없으면 내용 아래에 붙음)</span>
          <input type="file" accept="image/*" multiple data-photo="${key}" style="display:block;margin-top:6px" />
          <div class="thumbs" data-thumbs="${key}" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin-top:8px"></div>
        </div>`;
      fc.appendChild(div);
    }

    function renderThumbs(key) {
      const box = document.querySelector(`[data-thumbs="${key}"]`);
      box.innerHTML = "";
      photosByKey[key].forEach((item, idx) => {
        const src = item.url || (item.file ? URL.createObjectURL(item.file) : "");
        const el = document.createElement("div");
        el.style.cssText = "position:relative";
        el.innerHTML = `<div style="position:relative">
            <img src="${src}" style="width:100%;height:75px;object-fit:cover;border-radius:5px;border:1px solid #d7dbe0${item.uploading ? ";opacity:.4" : ""}" />
            <span style="position:absolute;top:2px;left:2px;background:#2f6fed;color:#fff;font-size:.68rem;font-weight:700;padding:1px 6px;border-radius:4px">사진${idx + 1}</span>
            ${item.uploading ? '<span style="position:absolute;bottom:2px;left:2px;background:rgba(0,0,0,.65);color:#fff;font-size:.62rem;padding:1px 5px;border-radius:4px">올리는중…</span>' : ""}
            <button title="삭제" style="position:absolute;top:2px;right:2px;background:rgba(0,0,0,.6);color:#fff;border:0;border-radius:50%;width:20px;height:20px;cursor:pointer;font-size:.7rem;padding:0">×</button>
          </div>
          <input type="text" placeholder="사진 설명" value="${(item.caption || "").replace(/"/g, "&quot;")}"
                 style="width:100%;margin-top:4px;font-size:.72rem;padding:4px;border:1px solid #d7dbe0;border-radius:5px" />`;
        el.querySelector("input").addEventListener("input", (e) => { item.caption = e.target.value; touched.add(key); scheduleAutoSave(); });
        el.querySelector("button").addEventListener("click", async () => {
          if (item.path) { try { await removePhoto(item.path); } catch (err) {} }
          const i = photosByKey[key].indexOf(item);
          if (i >= 0) photosByKey[key].splice(i, 1);
          touched.add(key);
          renderThumbs(key);
          scheduleAutoSave();
        });
        box.appendChild(el);
      });
    }
    for (const inp of document.querySelectorAll("[data-photo]")) {
      inp.addEventListener("change", async (e) => {
        const key = e.target.dataset.photo;
        const files = [...e.target.files];
        e.target.value = "";
        for (const f of files) {
          const item = { id: ++photoSeq, file: f, caption: "", uploading: true };
          photosByKey[key].push(item);
          renderThumbs(key);
          try {
            const c = await compressImage(f);
            const path = `${dateEl.value}/${key}/${item.id}_${Date.now()}.jpg`;
            await uploadPhoto(path, c.bytes);
            item.path = path; item.w = c.w; item.h = c.h; item.url = photoUrl(path);
            item.uploading = false; item.file = null;
            touched.add(key);
            renderThumbs(key);
            scheduleAutoSave();
          } catch (err) {
            item.uploading = false;
            setStatus("사진 업로드 실패: " + err.message + " (photos 버킷 만드셨나요?)", "err");
            renderThumbs(key);
          }
        }
      });
    }

    const status = document.getElementById("status");
    function setStatus(msg, cls) { status.textContent = msg; status.className = cls || ""; }

    // 날짜 → 요일 자동
    const dateEl = document.getElementById("date");
    const wdEl = document.getElementById("weekday");
    const weatherEl = document.getElementById("weather");
    const dateWarn = document.getElementById("dateWarn");
    function syncWeekday() {
      if (!dateEl.value) { wdEl.value = ""; return; }
      wdEl.value = WD[new Date(dateEl.value + "T00:00:00").getDay()];
    }

    // 현재 폼 내용 수집 / 저장
    function gatherContents() {
      const contents = {};
      for (const ta of document.querySelectorAll("textarea[data-key]"))
        contents[ta.dataset.key] = ta.value;
      return contents;
    }
    // 업로드 완료된 사진만 메타데이터로 (path 있는 것)
    function gatherPhotos() {
      const photos = {};
      for (const [key] of FACILITIES) {
        const list = (photosByKey[key] || []).filter((p) => p.path);
        if (list.length) photos[key] = list.map((p) => ({ path: p.path, caption: p.caption || "", w: p.w, h: p.h }));
      }
      return photos;
    }
    // 저장: 서버 최신본을 가져와 "내가 편집한 시설만" 덮어씀(다른 담당자 것 보존)
    async function saveDate(d) {
      const latest = await loadLog(d).catch(() => null);
      const contents = { ...((latest && latest.contents) || {}) };
      const photos = { ...((latest && latest.photos) || {}) };
      const curC = gatherContents();
      const curP = gatherPhotos();
      for (const key of touched) {
        contents[key] = curC[key] || "";
        if (curP[key]) photos[key] = curP[key]; else delete photos[key];
      }
      const weather = weatherTouched ? weatherEl.value : ((latest && latest.weather) ?? weatherEl.value);
      await saveLog({
        log_date: d, weekday: WD[new Date(d + "T00:00:00").getDay()],
        weather, contents, photos,
      });
    }

    let suppressSave = false;    // 불러오기 중 자동저장 방지
    let prevDate = dateEl.value; // 직전 날짜
    let dirty = false;           // 저장 안 된 변경
    let confirmedSaveDate = null; // 오늘 아닌 날짜 저장 확인을 마친 날짜

    const todayStr = () => new Date().toISOString().slice(0, 10);
    // 오늘이 아닌 날짜면 저장 전 확인(그 날짜당 1회)
    function okToSave() {
      const d = dateEl.value;
      if (d === todayStr() || confirmedSaveDate === d) return true;
      const ok = confirm(`⚠️ 오늘(${todayStr()})이 아닙니다.\n\n${d} 날짜에 저장하려고 합니다.\n이 날짜가 맞습니까? 저장할까요?`);
      if (ok) confirmedSaveDate = d;
      return ok;
    }

    // 저장된 내용 불러와 폼 채우기
    async function loadForDate() {
      syncWeekday();
      if (!dateEl.value) return;
      suppressSave = true;
      try {
        const log = await loadLog(dateEl.value);
        weatherEl.value = log?.weather || "";
        const c = (log && log.contents) || {};
        for (const ta of document.querySelectorAll("textarea[data-key]"))
          ta.value = c[ta.dataset.key] || "";
        // 사진 복원
        const ph = (log && log.photos) || {};
        for (const [key] of FACILITIES) {
          photosByKey[key] = (ph[key] || []).map((p) => ({
            id: ++photoSeq, caption: p.caption || "", path: p.path, w: p.w, h: p.h, url: photoUrl(p.path),
          }));
          renderThumbs(key);
        }
        setStatus(log ? `📂 ${dateEl.value} 저장본 불러옴` : `🆕 ${dateEl.value} 새 일지`, "ok");
        prevDate = dateEl.value;
        dirty = false;
        touched.clear();          // 불러온 뒤엔 편집한 것 없음
        weatherTouched = false;
        confirmedSaveDate = null; // 날짜 바뀌면 저장 확인 다시
        // 오늘이 아닌 날짜면 눈에 띄게 표시
        dateWarn.style.display = dateEl.value === todayStr() ? "none" : "block";
      } catch (err) {
        setStatus("불러오기 오류: " + err.message + " (테이블 생성됐나요?)", "err");
      } finally {
        suppressSave = false;
      }
    }

    // 자동 저장 (편집 멈추고 1.5초 뒤)
    let saveTimer = null;
    function scheduleAutoSave() {
      if (suppressSave) return;
      dirty = true;
      setStatus("✎ 편집 중…");
      clearTimeout(saveTimer);
      saveTimer = setTimeout(async () => {
        if (!okToSave()) { setStatus(`⚠️ 저장 취소됨 — ${dateEl.value}는 오늘이 아니에요`, "err"); return; }
        try {
          await saveDate(dateEl.value);
          dirty = false;
          const t = new Date().toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit" });
          setStatus(`💾 자동 저장됨 (${t})`, "ok");
        } catch (err) {
          setStatus("자동저장 실패: " + err.message + " (테이블 생성 필요?)", "err");
        }
      }, 1500);
    }
    weatherEl.addEventListener("input", () => { weatherTouched = true; scheduleAutoSave(); });
    for (const ta of document.querySelectorAll("textarea[data-key]"))
      ta.addEventListener("input", () => { touched.add(ta.dataset.key); scheduleAutoSave(); });

    // 날짜 변경: 막지 않고 이동(현재 내용은 저장) + 안내 메시지
    dateEl.addEventListener("change", async () => {
      const newDate = dateEl.value;
      if (newDate === prevDate) return;
      const old = prevDate;
      clearTimeout(saveTimer);
      if (dirty) { try { await saveDate(old); } catch (e) {} } // 이동 전 현재 날짜 저장
      await loadForDate();
      setStatus(`📅 ${newDate} 로 이동 — ${old} 내용은 저장됨`, "ok");
    });
    dateEl.value = new Date().toISOString().slice(0, 10);
    prevDate = dateEl.value;
    loadForDate();
    cleanupOld(6).catch(() => {}); // 6개월 지난 일지 자동 정리(조용히)

    // 수동 저장 버튼 (즉시)
    document.getElementById("save").addEventListener("click", async (e) => {
      if (!dateEl.value) { setStatus("날짜를 선택하세요.", "err"); return; }
      if (!okToSave()) { setStatus("저장 취소됨 — 날짜를 확인하세요", "err"); return; }
      e.currentTarget.disabled = true;
      setStatus("저장 중…");
      try {
        await saveDate(dateEl.value);
        dirty = false;
        setStatus(`✅ 저장 완료 (${dateEl.value})`, "ok");
      } catch (err) {
        console.error(err);
        setStatus("❌ 저장 오류: " + err.message + " (테이블 생성 필요할 수 있음)", "err");
      } finally {
        e.currentTarget.disabled = false;
      }
    });

    document.getElementById("download").addEventListener("click", async (e) => {
      const btn = e.currentTarget;
      if (!dateEl.value) { setStatus("날짜를 선택하세요.", "err"); return; }
      const [Y, M, D] = dateEl.value.split("-");
      const data = {
        MM: M, DD: D, WD: wdEl.value, WX: document.getElementById("weather").value,
      };
      for (const ta of document.querySelectorAll("textarea[data-key]"))
        data[ta.dataset.key] = ta.value;

      btn.disabled = true;
      try {
        // 시설별 사진: Storage에서 바이트 가져오기 (업로드 완료된 것만)
        const compressed = {};
        let done = 0, totalPhotos = 0;
        for (const k in photosByKey) totalPhotos += (photosByKey[k] || []).filter((p) => p.path).length;
        for (const [key] of FACILITIES) {
          const items = (photosByKey[key] || []).filter((p) => p.path);
          if (!items.length) continue;
          compressed[key] = [];
          for (const item of items) {
            setStatus(`사진 불러오는 중… (${++done}/${totalPhotos})`);
            const bytes = await fetchPhotoBytes(item.path);
            compressed[key].push({ idref: "photo" + item.id, bytes, w: item.w, h: item.h, caption: item.caption });
          }
        }
        setStatus("한글파일 생성 중…");
        const blob = await buildHwpx(data, compressed);
        const fname = `일일업무일지_${Y}년${M}월${D}일.hwpx`;
        downloadBlob(blob, fname);
        let totKB = 0;
        for (const k in compressed) for (const p of compressed[k]) totKB += p.bytes.length;
        setStatus(`✅ 다운로드 완료: ${fname}` + (totalPhotos ? ` (사진 ${totalPhotos}장, ${(totKB / 1024).toFixed(0)}KB)` : ""), "ok");
      } catch (err) {
        console.error(err);
        setStatus("❌ 오류: " + err.message, "err");
      } finally {
        btn.disabled = false;
      }
    });

    // 한 달치 다운로드
    const monthEl = document.getElementById("month");
    monthEl.value = dateEl.value.slice(0, 7);
    document.getElementById("monthDownload").addEventListener("click", async (e) => {
      const ym = monthEl.value;
      if (!ym) { setStatus("월을 선택하세요.", "err"); return; }
      const btn = e.currentTarget; btn.disabled = true;
      setStatus("한 달치 불러오는 중…");
      try {
        const days = await listMonth(ym);
        if (!days.length) { setStatus(`${ym} 에 저장된 일지가 없어요.`, "err"); return; }
        setStatus(`한글파일 생성 중… (${days.length}일)`);
        const blob = await buildMonthHwpx(days);
        const [yy, mm] = ym.split("-");
        downloadBlob(blob, `일일업무일지_${yy}년${mm}월.hwpx`);
        setStatus(`✅ ${ym} 한 달치 다운로드 (${days.length}일)`, "ok");
      } catch (err) {
        console.error(err);
        setStatus("❌ 오류: " + err.message, "err");
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
