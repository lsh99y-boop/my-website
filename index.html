<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KBS 전국 송중계소</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <script>try{var t=localStorage.getItem("ilji_theme");if(t)document.documentElement.setAttribute("data-theme",t);}catch(e){}</script>
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#2563eb" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="업무일지" />
  <script>if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){});});}</script>
  <style>
    :root {
      --bg:#f4f5f8; --surface:#ffffff; --surface-2:#f5f6f9; --line:#e7e9ef; --line-strong:#d8dbe3;
      --ink:#1b1f2a; --muted:#6b7280;
      --accent:#2563eb; --accent-ink:#ffffff; --accent-weak:#eef0fe; --accent-border:#dadcfb;
      --shadow-sm:0 1px 2px rgba(16,24,40,.05); --shadow:0 2px 4px rgba(16,24,40,.04), 0 12px 30px rgba(16,24,40,.10);
      --radius:16px;
    }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
      --bg:#0e131c; --surface:#161c28; --surface-2:#1e2532; --line:#2a3342; --line-strong:#3a4455;
      --ink:#e6e9f0; --muted:#96a1b4;
      --accent:#60a5fa; --accent-ink:#0e131c; --accent-weak:#232b45; --accent-border:#3a4468;
      --shadow-sm:0 1px 2px rgba(0,0,0,.4); --shadow:0 2px 6px rgba(0,0,0,.35), 0 12px 30px rgba(0,0,0,.45);
    } }
    :root[data-theme="dark"] {
      --bg:#0e131c; --surface:#161c28; --surface-2:#1e2532; --line:#2a3342; --line-strong:#3a4455;
      --ink:#e6e9f0; --muted:#96a1b4;
      --accent:#60a5fa; --accent-ink:#0e131c; --accent-weak:#232b45; --accent-border:#3a4468;
      --shadow-sm:0 1px 2px rgba(0,0,0,.4); --shadow:0 2px 6px rgba(0,0,0,.35), 0 12px 30px rgba(0,0,0,.45);
    }
    * { box-sizing: border-box; }
    body { font-family:"Pretendard Variable",Pretendard,system-ui,"Malgun Gothic",sans-serif; margin:0; background:var(--bg); color:var(--ink); -webkit-font-smoothing:antialiased; min-height:100vh; }

    .top { display:flex; justify-content:flex-end; padding:12px 16px; }
    .icon-btn { color:var(--accent); background:var(--surface); border:1px solid var(--accent-border); border-radius:9px; padding:8px 10px; font-size:1rem; line-height:1; cursor:pointer; }
    .icon-btn:hover { background:var(--accent-weak); }

    .wrap { max-width:900px; margin:0 auto; padding:10px 18px 60px; }
    .hero { text-align:center; margin:22px 0 28px; }
    .hero .logo { width:64px; height:64px; border-radius:16px; margin:0 auto 14px; display:flex; align-items:center; justify-content:center; background:var(--accent); color:var(--accent-ink); font-size:1.6rem; font-weight:800; box-shadow:var(--shadow); }
    .hero h1 { font-size:1.5rem; margin:0 0 6px; letter-spacing:-.02em; }
    .hero p { color:var(--muted); margin:0; font-size:.95rem; }

    .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:16px; }
    .tile { display:flex; flex-direction:column; gap:8px; text-decoration:none; color:inherit; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:22px 20px; box-shadow:var(--shadow-sm); transition:transform .12s, box-shadow .12s, border-color .12s; }
    .tile:hover { transform:translateY(-3px); box-shadow:var(--shadow); border-color:var(--accent-border); }
    .tile .emoji { font-size:2rem; }
    .tile .t { font-size:1.15rem; font-weight:800; letter-spacing:-.01em; }
    .tile .d { font-size:.86rem; color:var(--muted); line-height:1.5; }
    .tile .go { margin-top:auto; font-size:.82rem; font-weight:700; color:var(--accent); }

    .foot { text-align:center; color:var(--muted); font-size:.82rem; margin-top:30px; }
    .foot a { color:var(--accent); text-decoration:none; }
  </style>
</head>
<body>
  <div id="pinGate" style="position:fixed;inset:0;background:#0e1420;z-index:9999;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;color:#e6ebf2;padding:20px;text-align:center">
    <div style="font-size:1.3rem;font-weight:700">📡 KBS 전국 송중계소</div>
    <div style="color:#8a94a3;font-size:.9rem">접속 PIN을 입력하세요</div>
    <input id="pinInput" type="password" inputmode="numeric" maxlength="12" placeholder="PIN"
           style="font-size:1.4rem;text-align:center;letter-spacing:.25em;padding:10px 16px;border-radius:8px;border:1px solid #2a3550;background:#182130;color:#fff;width:200px" />
    <button id="pinOk" style="background:#2f6fed;color:#fff;padding:11px 28px;font-size:1rem;border:0;border-radius:8px;cursor:pointer">확인</button>
    <div id="pinErr" style="color:#ff6b6b;font-size:.85rem;height:1.1em"></div>
  </div>

  <div class="top">
    <button class="icon-btn" id="themeToggle" title="라이트/다크 전환">🌙</button>
  </div>

  <div class="wrap">
    <div class="hero">
      <div class="logo">📡</div>
      <h1>KBS 전국 송중계소</h1>
      <p>일일업무일지 · 정비사례 · 데이터 분석</p>
    </div>

    <div class="cards">
      <a class="tile" href="daily.html">
        <div class="emoji">📋</div>
        <div class="t">일일업무일지</div>
        <div class="d">매일 시설별 업무를 작성하고 한글파일로 다운로드</div>
        <div class="go">작성하기 →</div>
      </a>
      <a class="tile" href="cases.html">
        <div class="emoji">🔧</div>
        <div class="t">정비사례</div>
        <div class="d">고장·정비 사례를 등록·검색하고 장애보고서 생성 (전국 공용)</div>
        <div class="go">입력·검색 →</div>
      </a>
      <a class="tile" href="analysis.html">
        <div class="emoji">📊</div>
        <div class="t">데이터 분석</div>
        <div class="d">모델별 고장·시설별·월별 추세 통계 (일지+정비사례)</div>
        <div class="go">분석 보기 →</div>
      </a>
    </div>

    <div class="foot">📖 처음이면 <a href="help.html">사용법</a>을 먼저 보세요 · 팀 공용 PIN 7590</div>
  </div>

  <script>
    (function () {
      var APP_PIN = "7590";
      var gate = document.getElementById("pinGate");
      try { if (localStorage.getItem("ilji_pin_ok") === APP_PIN) gate.remove(); } catch (e) {}
      if (gate.parentNode) {
        var inp = document.getElementById("pinInput"), err = document.getElementById("pinErr");
        var go = function () {
          if (inp.value === APP_PIN) { try { localStorage.setItem("ilji_pin_ok", APP_PIN); } catch (e) {} gate.remove(); }
          else { err.textContent = "PIN이 틀렸어요"; inp.value = ""; inp.focus(); }
        };
        document.getElementById("pinOk").addEventListener("click", go);
        inp.addEventListener("keydown", function (e) { if (e.key === "Enter") go(); });
        inp.focus();
      }
      var tbtn = document.getElementById("themeToggle");
      function paint(t) { var r = document.documentElement; if (t) r.setAttribute("data-theme", t); else r.removeAttribute("data-theme"); tbtn.textContent = (t ? t === "dark" : matchMedia("(prefers-color-scheme: dark)").matches) ? "☀️" : "🌙"; }
      paint(localStorage.getItem("ilji_theme"));
      tbtn.addEventListener("click", function () { var r = document.documentElement; var cur = r.getAttribute("data-theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"); var nx = cur === "dark" ? "light" : "dark"; try { localStorage.setItem("ilji_theme", nx); } catch (e) {} paint(nx); });
    })();
  </script>
</body>
</html>
