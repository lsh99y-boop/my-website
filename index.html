<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>일일업무일지 작성</title>
  <style>
    :root { --line:#d7dbe0; --bg:#eef1f5; --accent:#2f6fed; --ink:#1a2230; --muted:#6b7480;
            --green:#067d3b; --greenbg:#e3f0e8; --amber:#b3820a; --amberbg:#fdf2d8; }
    * { box-sizing: border-box; }
    body { font-family: system-ui, "Malgun Gothic", sans-serif; margin: 0; background: var(--bg); color: var(--ink); }
    input, textarea, select { font: inherit; }
    input:focus, textarea:focus, select:focus { outline: 2px solid var(--accent); border-color: var(--accent); }
    button { font: inherit; font-weight: 600; border: 0; border-radius: 8px; padding: 9px 16px; cursor: pointer; }
    .primary { background: var(--accent); color:#fff; } .primary:disabled { opacity:.5; cursor:default; }

    /* 상단 스티키 바 */
    .topbar { position: sticky; top: 0; z-index: 60; background:#fff; border-bottom:1px solid var(--line); box-shadow:0 1px 4px rgba(0,0,0,.05); }
    .topbar-inner { max-width:1180px; margin:0 auto; padding:9px 16px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
    .brand { font-weight:800; font-size:1rem; white-space:nowrap; margin-right:4px; }
    .tb-office { display:flex; align-items:center; gap:6px; background:#eef3ff; border:1px solid #cfdcfb; border-radius:10px; padding:4px 8px 4px 11px; }
    .tb-office label { font-size:.7rem; color:var(--accent); font-weight:700; }
    #office { font:inherit; font-weight:700; font-size:.98rem; border:0; background:transparent; color:var(--accent); cursor:pointer; }
    .tb-field { display:flex; flex-direction:column; }
    .tb-field label { font-size:.66rem; color:var(--muted); font-weight:600; }
    .topbar input, .topbar select { border:1px solid var(--line); border-radius:7px; padding:6px 8px; background:#fff; }
    .tb-actions { margin-left:auto; display:flex; gap:6px; align-items:center; }
    .tb-btn { color:var(--accent); background:#fff; text-decoration:none; font-weight:600; font-size:.82rem; white-space:nowrap; border:1px solid #cfdcfb; border-radius:8px; padding:8px 11px; cursor:pointer; }
    .saved { font-size:.74rem; color:var(--muted); white-space:nowrap; }
    .saved.ok { color:var(--green); }
    /* 다운로드 메뉴 */
    .menuwrap { position:relative; }
    .menu { display:none; position:absolute; right:0; top:110%; background:#fff; border:1px solid var(--line); border-radius:10px; box-shadow:0 6px 20px rgba(0,0,0,.12); padding:6px; min-width:190px; z-index:70; }
    .menu.open { display:block; }
    .menu button { display:block; width:100%; text-align:left; background:#fff; color:var(--ink); font-weight:600; padding:9px 12px; border-radius:7px; }
    .menu button:hover { background:#f4f7ff; }
    .menu .mrow { display:flex; gap:6px; align-items:center; padding:6px 8px; }
    .menu input[type=month] { border:1px solid var(--line); border-radius:6px; padding:5px 7px; }

    /* 레이아웃: 사이드바 + 본문 */
    .layout { max-width:1360px; margin:14px auto; padding:0 16px 90px; display:grid; grid-template-columns:230px 1fr; gap:20px; align-items:start; }
    .sidebar { position:sticky; top:64px; align-self:start; }
    .prog { background:#fff; border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin-bottom:10px; }
    .prog .n { font-weight:800; font-size:1.05rem; } .prog .n b { color:var(--accent); }
    .progbar { height:7px; background:#e6eaf0; border-radius:6px; margin-top:8px; overflow:hidden; }
    .progbar > i { display:block; height:100%; background:var(--green); border-radius:6px; transition:width .2s; }
    .navlist { background:#fff; border:1px solid var(--line); border-radius:10px; padding:6px; }
    .navitem { display:flex; align-items:center; gap:8px; padding:8px 10px; border-radius:8px; cursor:pointer; font-size:.9rem; }
    .navitem:hover { background:#f4f7ff; }
    .navitem.active { background:#eef3ff; }
    .navitem .dot { width:16px; height:16px; border-radius:50%; flex:none; display:inline-flex; align-items:center; justify-content:center; font-size:.62rem; color:#fff; background:#c4cad3; }
    .navitem.done .dot { background:var(--green); }
    .navitem.dirty .dot { background:var(--amber); }
    .navitem .nm { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .navitem .cnt { font-size:.68rem; color:var(--muted); }

    /* 본문 */
    .content { max-width:800px; }
    /* 한 시설만 볼 때: 넓게 + 크게 */
    .content.focus { max-width:100%; }
    .content.focus .fac { padding:22px 26px; }
    .content.focus .fac-name { font-size:1.35rem; }
    .content.focus .fac textarea { min-height:300px; font-size:1.05rem; }
    .hint-top { color:var(--muted); font-size:.82rem; margin:0 2px 12px; }
    .warn { background:#fff6e6; border-left:4px solid #e0a800; padding:9px 13px; border-radius:6px; font-size:.85rem; color:#8a6d00; margin-bottom:12px; }
    #facilities { display:flex; flex-direction:column; gap:14px; }
    .fac { background:#fff; border:1px solid var(--line); border-radius:12px; padding:14px 16px; scroll-margin-top:70px; }
    .fac.filled { border-color:#a9c5ff; }
    .fac.flash { animation: flash 1.2s ease; }
    @keyframes flash { 0%{ box-shadow:0 0 0 3px rgba(47,111,237,.35); } 100%{ box-shadow:0 0 0 0 rgba(47,111,237,0); } }
    .fac-head { display:flex; align-items:center; gap:9px; margin-bottom:9px; }
    .fac-name { font-weight:800; font-size:1.05rem; }
    .fac-badge { font-size:.68rem; padding:2px 9px; border-radius:20px; background:#eef1f5; color:var(--muted); font-weight:700; }
    .fac.filled .fac-badge { background:var(--greenbg); color:var(--green); }
    .fac textarea { width:100%; min-height:70px; resize:none; overflow:hidden; line-height:1.55; border:1px solid var(--line); border-radius:8px; padding:10px 12px; background:#fff; }
    .dropzone { margin-top:10px; border:1.5px dashed #c4cdd8; border-radius:10px; padding:12px; text-align:center; color:var(--muted); font-size:.84rem; cursor:pointer; background:#fafbfd; }
    .dropzone.drag { border-color:var(--accent); background:#eef3ff; color:var(--accent); }
    .thumbs { display:grid; grid-template-columns:repeat(auto-fill,minmax(96px,1fr)); gap:8px; margin-top:9px; }

    /* 하단 없음 — 저장/다운로드는 상단바 */
    #status { font-size:.82rem; color:var(--muted); }
    #status.ok { color:var(--green); } #status.err { color:#b3261e; }

    @media (max-width: 880px) {
      .layout { grid-template-columns:1fr; gap:12px; }
      .sidebar { position:static; }
      .navlist { display:flex; overflow-x:auto; gap:4px; }
      .navitem { white-space:nowrap; }
      .navitem .cnt { display:none; }
      .content { max-width:100%; }
    }
  </style>
</head>
<body>
  <div id="pinGate" style="position:fixed;inset:0;background:#0e1420;z-index:9999;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;color:#e6ebf2;font-family:system-ui,'Malgun Gothic',sans-serif;padding:20px;text-align:center">
    <div style="font-size:1.3rem;font-weight:700">📋 일일업무일지</div>
    <div style="color:#8a94a3;font-size:.9rem">접속 PIN을 입력하세요</div>
    <input id="pinInput" type="password" inputmode="numeric" maxlength="12" placeholder="PIN"
           style="font-size:1.4rem;text-align:center;letter-spacing:.25em;padding:10px 16px;border-radius:8px;border:1px solid #2a3550;background:#182130;color:#fff;width:200px" />
    <button id="pinOk" style="background:#2f6fed;color:#fff;border:0;border-radius:8px;padding:11px 28px;font-weight:600;cursor:pointer;font-size:1rem">확인</button>
    <div id="pinErr" style="color:#ff6b6b;font-size:.85rem;height:1.1em"></div>
  </div>

  <div class="topbar">
    <div class="topbar-inner">
      <div class="brand">📋 일일업무일지</div>
      <div class="tb-office"><label>소속국</label><select id="office"></select></div>
      <div class="tb-field"><label for="date">날짜</label><input type="date" id="date" /></div>
      <div class="tb-field"><label for="weekday">요일</label><input type="text" id="weekday" style="width:46px" readonly /></div>
      <div class="tb-field" style="min-width:96px"><label for="weather">날씨</label><input type="text" id="weather" placeholder="맑음" /></div>
      <div class="tb-actions">
        <span class="saved" id="status"></span>
        <button class="tb-btn" id="save">💾 저장</button>
        <div class="menuwrap">
          <button class="tb-btn" id="dlBtn">📄 다운로드 ▾</button>
          <div class="menu" id="dlMenu">
            <button id="download">📄 이 날 (하루치)</button>
            <div class="mrow"><input type="month" id="month" /><button id="monthDownload" class="primary" style="padding:7px 11px">이 달 전체</button></div>
          </div>
        </div>
        <button class="tb-btn" id="searchOpen">🔍 검색</button>
        <a class="tb-btn" href="cases.html">🔧 고장사례</a>
        <a class="tb-btn" href="help.html">📖 사용법</a>
      </div>
    </div>
  </div>

  <div class="layout">
    <aside class="sidebar">
      <div class="prog">
        <div class="n"><b id="progDone">0</b>/<span id="progTotal">0</span> 시설 작성</div>
        <div class="progbar"><i id="progFill" style="width:0%"></i></div>
      </div>
      <div class="navlist" id="navlist"></div>
    </aside>
    <div class="content">
      <div id="dateWarn" class="warn" style="display:none">⚠️ <b>오늘 날짜가 아닙니다.</b> 과거·미래 날짜에 작성 중 — 저장 시 한 번 더 확인합니다.</div>
      <div class="hint-top">시설칸에 쓰면 <b>자동 저장</b>돼요. 사진은 각 칸에 <b>드래그하거나 눌러서</b> 추가(중간 삽입은 <code>[사진1]</code>). 빈칸은 문서에 ◎만.</div>
      <div id="facilities"></div>
    </div>
  </div>

  <div id="searchModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:8000;padding:16px;overflow:auto">
    <div style="max-width:720px;margin:24px auto;background:#fff;border-radius:12px;padding:18px">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <h2 style="margin:0;font-size:1.05rem">🔍 지난 일지 검색</h2>
        <button id="searchClose" style="background:#eef1f5;color:#333;padding:8px 14px">닫기</button>
      </div>
      <div style="display:flex;gap:10px;margin-top:12px;flex-wrap:wrap">
        <input id="searchQ" placeholder="내용 키워드 (예: 정전, 냉각, 활차…)" style="flex:1;min-width:180px" />
        <select id="searchOffice" style="min-width:110px;border:1px solid var(--line);border-radius:7px;padding:8px 10px"></select>
        <button class="primary" id="searchGo">검색</button>
      </div>
      <div id="searchResults" style="margin-top:14px"><div style="color:#8a94a3;font-size:.9rem;padding:8px 2px">키워드를 입력하고 검색하세요.</div></div>
    </div>
  </div>

  <script type="module">
    import { buildHwpx, buildMonthHwpx, downloadBlob } from "./hwpx.js";
    import { compressImage } from "./photo.js";
    import { saveLog, loadLog, cleanupOld, listMonth, searchLogs } from "./storage.js";
    import { uploadPhoto, photoUrl, removePhoto, fetchPhotoBytes } from "./photoStorage.js";
    import { facilitiesFor, OFFICE_LIST, labelForKey } from "./sites.js";

    // ===== 접속 PIN (팀 공용) =====
    const APP_PIN = "7590"; // ← 팀 공용 PIN
    (function pinGate() {
      const gate = document.getElementById("pinGate");
      if (localStorage.getItem("ilji_pin_ok") === APP_PIN) { gate.remove(); return; }
      const inp = document.getElementById("pinInput");
      const err = document.getElementById("pinErr");
      const tryPin = () => {
        if (inp.value === APP_PIN) { localStorage.setItem("ilji_pin_ok", APP_PIN); gate.remove(); }
        else { err.textContent = "PIN이 틀렸어요"; inp.value = ""; inp.focus(); }
      };
      document.getElementById("pinOk").addEventListener("click", tryPin);
      inp.addEventListener("keydown", (e) => { if (e.key === "Enter") tryPin(); });
      inp.focus();
    })();

    const WD = ["일","월","화","수","목","금","토"];

    let currentOffice = localStorage.getItem("ilji_office") || "대전";
    let FACILITIES = facilitiesFor(currentOffice); // [[label, key], ...]

    // 시설별 사진 저장 {key: [{id, file}]}
    const photosByKey = {};
    let photoSeq = 0;
    const touched = new Set();   // 이번에 내가 편집한 시설(이것만 저장 시 덮어씀)
    let weatherTouched = false;  // 날씨를 내가 바꿨나

    const fc = document.getElementById("facilities");

    // 사진 업로드 (파일 배열) — 파일선택·드래그앤드롭 공용
    async function processPhotoFiles(key, files) {
      for (const f of files) {
        if (!f.type || !f.type.startsWith("image/")) continue;
        const item = { id: ++photoSeq, file: f, caption: "", uploading: true };
        photosByKey[key].push(item);
        renderThumbs(key);
        try {
          const c = await compressImage(f);
          const path = `${currentOffice}/${dateEl.value}/${key}/${item.id}_${Date.now()}.jpg`;
          await uploadPhoto(path, c.bytes);
          item.path = path; item.w = c.w; item.h = c.h; item.url = photoUrl(path);
          item.uploading = false; item.file = null;
          touched.add(key); renderThumbs(key); scheduleAutoSave();
        } catch (err) {
          item.uploading = false;
          setStatus("사진 업로드 실패 (photos 버킷 필요)", "err");
          renderThumbs(key);
        }
      }
    }

    // 텍스트영역 자동 높이
    function autoGrow(ta) { ta.style.height = "auto"; ta.style.height = Math.max(70, ta.scrollHeight + 2) + "px"; }

    // 진행률 갱신
    function updateProgress() {
      const total = FACILITIES.length; let done = 0;
      for (const [, key] of FACILITIES) {
        const ta = fc.querySelector(`.fac[data-fac="${CSS.escape(key)}"] textarea`);
        if ((ta && ta.value.trim()) || (photosByKey[key] || []).length) done++;
      }
      document.getElementById("progDone").textContent = done;
      document.getElementById("progTotal").textContent = total;
      document.getElementById("progFill").style.width = total ? Math.round(done / total * 100) + "%" : "0%";
    }

    // 시설칸 상태(카드 뱃지 + 사이드바 + 진행률)
    function updateFacStatus(key) {
      const fac = fc.querySelector(`.fac[data-fac="${CSS.escape(key)}"]`);
      const nav = document.querySelector(`.navitem[data-nav="${CSS.escape(key)}"]`);
      const ta = fac && fac.querySelector("textarea");
      const nphoto = (photosByKey[key] || []).length;
      const has = (ta && ta.value.trim().length > 0) || nphoto > 0;
      if (fac) {
        fac.classList.toggle("filled", has);
        fac.querySelector(".fac-badge").textContent = has ? (nphoto ? `작성·📷${nphoto}` : "작성됨") : "빈칸";
      }
      if (nav) {
        nav.classList.toggle("done", has);
        nav.classList.toggle("dirty", !has && touched.has(key));
        nav.querySelector(".dot").textContent = has ? "✓" : "";
        nav.querySelector(".cnt").textContent = nphoto ? `📷${nphoto}` : "";
      }
      updateProgress();
    }

    // 보기 전환: 특정 시설만 표시 / 전체
    function applyView(key) {
      const all = key === "__all__";
      for (const f of fc.querySelectorAll(".fac")) f.style.display = (all || f.dataset.fac === key) ? "" : "none";
      fc.closest(".content").classList.toggle("focus", !all);
      document.querySelectorAll(".navitem").forEach((x) => x.classList.toggle("active", x.dataset.nav === key));
      window.scrollTo({ top: 0, behavior: "smooth" });
      if (!all) {
        const div = fc.querySelector(`.fac[data-fac="${CSS.escape(key)}"]`);
        if (div) { const ta = div.querySelector("textarea"); if (ta) { autoGrow(ta); ta.focus({ preventScroll: true }); } }
      }
    }

    // 국의 시설 카드 + 사이드바 생성
    function buildFacilityCards() {
      FACILITIES = facilitiesFor(currentOffice);
      fc.innerHTML = "";
      for (const k in photosByKey) delete photosByKey[k];
      const nav = document.getElementById("navlist");
      nav.innerHTML = "";
      // 전체 보기
      const allItem = document.createElement("div");
      allItem.className = "navitem"; allItem.dataset.nav = "__all__";
      allItem.innerHTML = `<span class="dot" style="background:var(--accent);font-size:.7rem">≡</span><span class="nm" style="font-weight:700">전체 보기</span>`;
      allItem.addEventListener("click", () => applyView("__all__"));
      nav.appendChild(allItem);
      for (const [label, key] of FACILITIES) {
        photosByKey[key] = [];
        const div = document.createElement("div");
        div.className = "fac"; div.dataset.fac = key;
        div.innerHTML = `
          <div class="fac-head"><span class="fac-name">${label}</span><span class="fac-badge">빈칸</span></div>
          <textarea data-key="${key}" placeholder="업무 추진 내용…  (사진 중간 삽입은 [사진1])"></textarea>
          <div class="dropzone" data-drop="${key}">📷 사진 — 여기로 드래그하거나 클릭해서 추가</div>
          <input type="file" accept="image/*" multiple data-photo="${key}" style="display:none" />
          <div class="thumbs" data-thumbs="${key}"></div>`;
        fc.appendChild(div);
        const ni = document.createElement("div");
        ni.className = "navitem"; ni.dataset.nav = key;
        ni.innerHTML = `<span class="dot"></span><span class="nm">${label}</span><span class="cnt"></span>`;
        ni.addEventListener("click", () => {
          applyView(key);
          div.classList.remove("flash"); void div.offsetWidth; div.classList.add("flash");
        });
        nav.appendChild(ni);
      }
      for (const ta of fc.querySelectorAll("textarea[data-key]"))
        ta.addEventListener("input", () => { touched.add(ta.dataset.key); autoGrow(ta); updateFacStatus(ta.dataset.key); scheduleAutoSave(); });
      for (const inp of fc.querySelectorAll("[data-photo]"))
        inp.addEventListener("change", (e) => { const key = e.target.dataset.photo; const files = [...e.target.files]; e.target.value = ""; processPhotoFiles(key, files); });
      for (const dz of fc.querySelectorAll(".dropzone")) {
        const key = dz.dataset.drop;
        const input = fc.querySelector(`input[data-photo="${CSS.escape(key)}"]`);
        dz.addEventListener("click", () => input.click());
        dz.addEventListener("dragover", (e) => { e.preventDefault(); dz.classList.add("drag"); });
        dz.addEventListener("dragleave", () => dz.classList.remove("drag"));
        dz.addEventListener("drop", (e) => { e.preventDefault(); dz.classList.remove("drag"); processPhotoFiles(key, [...e.dataTransfer.files]); });
      }
      updateProgress();
      if (FACILITIES.length) applyView(FACILITIES[0][1]); // 기본: 첫 시설만
    }

    function renderThumbs(key) {
      const box = document.querySelector(`[data-thumbs="${CSS.escape(key)}"]`);
      if (!box) return;
      box.innerHTML = "";
      photosByKey[key].forEach((item, idx) => {
        const src = item.url || (item.file ? URL.createObjectURL(item.file) : "");
        const el = document.createElement("div");
        el.style.cssText = "position:relative";
        el.innerHTML = `<div style="position:relative">
            <img src="${src}" style="width:100%;height:78px;object-fit:cover;border-radius:5px;border:1px solid #d7dbe0${item.uploading ? ";opacity:.4" : ""}" />
            <span style="position:absolute;top:2px;left:2px;background:#2f6fed;color:#fff;font-size:.68rem;font-weight:700;padding:1px 6px;border-radius:4px">사진${idx + 1}</span>
            ${item.uploading ? '<span style="position:absolute;bottom:2px;left:2px;background:rgba(0,0,0,.65);color:#fff;font-size:.62rem;padding:1px 5px;border-radius:4px">올리는중…</span>' : ""}
            <button title="삭제" style="position:absolute;top:2px;right:2px;background:rgba(0,0,0,.6);color:#fff;border:0;border-radius:50%;width:20px;height:20px;cursor:pointer;font-size:.7rem;padding:0">×</button>
          </div>
          <input type="text" placeholder="사진 설명" value="${(item.caption || "").replace(/"/g, "&quot;")}"
                 style="width:100%;margin-top:4px;font-size:.72rem;padding:4px;border:1px solid #d7dbe0;border-radius:5px" />`;
        el.querySelector("input").addEventListener("input", (e) => { item.caption = e.target.value; touched.add(key); scheduleAutoSave(); });
        el.querySelector("button").addEventListener("click", async () => {
          if (item.path) { try { await removePhoto(item.path); } catch (err) {} }
          const i = photosByKey[key].indexOf(item);
          if (i >= 0) photosByKey[key].splice(i, 1);
          touched.add(key); renderThumbs(key); scheduleAutoSave();
        });
        box.appendChild(el);
      });
      updateFacStatus(key);
    }

    const status = document.getElementById("status");
    function setStatus(msg, cls) { status.textContent = msg; status.className = "saved " + (cls || ""); }

    // 날짜 → 요일 자동
    const dateEl = document.getElementById("date");
    const wdEl = document.getElementById("weekday");
    const weatherEl = document.getElementById("weather");
    const dateWarn = document.getElementById("dateWarn");
    function syncWeekday() {
      if (!dateEl.value) { wdEl.value = ""; return; }
      wdEl.value = WD[new Date(dateEl.value + "T00:00:00").getDay()];
    }

    // 현재 폼 내용 수집 / 저장
    function gatherContents() {
      const contents = {};
      for (const ta of document.querySelectorAll("textarea[data-key]"))
        contents[ta.dataset.key] = ta.value;
      return contents;
    }
    // 업로드 완료된 사진만 메타데이터로 (path 있는 것)
    function gatherPhotos() {
      const photos = {};
      for (const [, key] of FACILITIES) {
        const list = (photosByKey[key] || []).filter((p) => p.path);
        if (list.length) photos[key] = list.map((p) => ({ path: p.path, caption: p.caption || "", w: p.w, h: p.h }));
      }
      return photos;
    }
    // 저장: 서버 최신본을 가져와 "내가 편집한 시설만" 덮어씀(다른 담당자 것 보존)
    async function saveDate(d) {
      const latest = await loadLog(currentOffice, d).catch(() => null);
      const contents = { ...((latest && latest.contents) || {}) };
      const photos = { ...((latest && latest.photos) || {}) };
      const curC = gatherContents();
      const curP = gatherPhotos();
      for (const key of touched) {
        contents[key] = curC[key] || "";
        if (curP[key]) photos[key] = curP[key]; else delete photos[key];
      }
      const weather = weatherTouched ? weatherEl.value : ((latest && latest.weather) ?? weatherEl.value);
      await saveLog({
        office: currentOffice, log_date: d, weekday: WD[new Date(d + "T00:00:00").getDay()],
        weather, contents, photos,
      });
    }

    let suppressSave = false;    // 불러오기 중 자동저장 방지
    let prevDate = dateEl.value; // 직전 날짜
    let dirty = false;           // 저장 안 된 변경
    let confirmedSaveDate = null; // 오늘 아닌 날짜 저장 확인을 마친 날짜

    const todayStr = () => new Date().toISOString().slice(0, 10);
    // 오늘이 아닌 날짜면 저장 전 확인(그 날짜당 1회)
    function okToSave() {
      const d = dateEl.value;
      if (d === todayStr() || confirmedSaveDate === d) return true;
      const ok = confirm(`⚠️ 오늘(${todayStr()})이 아닙니다.\n\n${d} 날짜에 저장하려고 합니다.\n이 날짜가 맞습니까? 저장할까요?`);
      if (ok) confirmedSaveDate = d;
      return ok;
    }

    // 저장된 내용 불러와 폼 채우기
    async function loadForDate() {
      syncWeekday();
      if (!dateEl.value) return;
      suppressSave = true;
      try {
        const log = await loadLog(currentOffice, dateEl.value);
        weatherEl.value = log?.weather || "";
        const c = (log && log.contents) || {};
        for (const ta of document.querySelectorAll("textarea[data-key]")) {
          ta.value = c[ta.dataset.key] || "";
          autoGrow(ta);
        }
        // 사진 복원
        const ph = (log && log.photos) || {};
        for (const [, key] of FACILITIES) {
          photosByKey[key] = (ph[key] || []).map((p) => ({
            id: ++photoSeq, caption: p.caption || "", path: p.path, w: p.w, h: p.h, url: photoUrl(p.path),
          }));
          renderThumbs(key);
        }
        setStatus(log ? `📂 ${dateEl.value} 저장본 불러옴` : `🆕 ${dateEl.value} 새 일지`, "ok");
        prevDate = dateEl.value;
        dirty = false;
        touched.clear();          // 불러온 뒤엔 편집한 것 없음
        weatherTouched = false;
        confirmedSaveDate = null; // 날짜 바뀌면 저장 확인 다시
        // 오늘이 아닌 날짜면 눈에 띄게 표시
        dateWarn.style.display = dateEl.value === todayStr() ? "none" : "block";
      } catch (err) {
        setStatus("불러오기 오류: " + err.message + " (테이블 생성됐나요?)", "err");
      } finally {
        suppressSave = false;
      }
    }

    // 자동 저장 (편집 멈추고 1.5초 뒤)
    let saveTimer = null;
    function scheduleAutoSave() {
      if (suppressSave) return;
      dirty = true;
      setStatus("✎ 편집 중…");
      clearTimeout(saveTimer);
      saveTimer = setTimeout(async () => {
        if (!okToSave()) { setStatus(`⚠️ 저장 취소됨 — ${dateEl.value}는 오늘이 아니에요`, "err"); return; }
        try {
          await saveDate(dateEl.value);
          dirty = false;
          const t = new Date().toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit" });
          setStatus(`💾 자동 저장됨 (${t})`, "ok");
        } catch (err) {
          setStatus("자동저장 실패: " + err.message + " (테이블 생성 필요?)", "err");
        }
      }, 1500);
    }
    weatherEl.addEventListener("input", () => { weatherTouched = true; scheduleAutoSave(); });

    // 소속국 선택
    const officeEl = document.getElementById("office");
    officeEl.innerHTML = OFFICE_LIST.map((o) => `<option${o === currentOffice ? " selected" : ""}>${o}</option>`).join("");
    officeEl.addEventListener("change", async () => {
      currentOffice = officeEl.value;
      localStorage.setItem("ilji_office", currentOffice);
      buildFacilityCards();
      await loadForDate();
      setStatus(`🏢 ${currentOffice} 선택`, "ok");
    });

    // 날짜 변경: 막지 않고 이동(현재 내용은 저장) + 안내 메시지
    dateEl.addEventListener("change", async () => {
      const newDate = dateEl.value;
      if (newDate === prevDate) return;
      const old = prevDate;
      clearTimeout(saveTimer);
      if (dirty) { try { await saveDate(old); } catch (e) {} } // 이동 전 현재 날짜 저장
      await loadForDate();
      setStatus(`📅 ${newDate} 로 이동 — ${old} 내용은 저장됨`, "ok");
    });
    buildFacilityCards();          // 국별 시설 카드 생성
    dateEl.value = new Date().toISOString().slice(0, 10);
    prevDate = dateEl.value;
    loadForDate();
    cleanupOld(6).catch(() => {}); // 6개월 지난 일지 자동 정리(조용히)

    // 다운로드 메뉴 토글
    const dlMenu = document.getElementById("dlMenu");
    document.getElementById("dlBtn").addEventListener("click", (e) => { e.stopPropagation(); dlMenu.classList.toggle("open"); });
    document.addEventListener("click", (e) => { if (!e.target.closest(".menuwrap")) dlMenu.classList.remove("open"); });

    // 수동 저장 버튼 (즉시)
    document.getElementById("save").addEventListener("click", async (e) => {
      if (!dateEl.value) { setStatus("날짜를 선택하세요.", "err"); return; }
      if (!okToSave()) { setStatus("저장 취소됨 — 날짜를 확인하세요", "err"); return; }
      e.currentTarget.disabled = true;
      setStatus("저장 중…");
      try {
        await saveDate(dateEl.value);
        dirty = false;
        setStatus(`✅ 저장 완료 (${dateEl.value})`, "ok");
      } catch (err) {
        console.error(err);
        setStatus("❌ 저장 오류: " + err.message + " (테이블 생성 필요할 수 있음)", "err");
      } finally {
        e.currentTarget.disabled = false;
      }
    });

    document.getElementById("download").addEventListener("click", async (e) => {
      const btn = e.currentTarget;
      if (!dateEl.value) { setStatus("날짜를 선택하세요.", "err"); return; }
      const [Y, M, D] = dateEl.value.split("-");
      const data = {
        MM: M, DD: D, WD: wdEl.value, WX: document.getElementById("weather").value,
      };
      for (const ta of document.querySelectorAll("textarea[data-key]"))
        data[ta.dataset.key] = ta.value;

      btn.disabled = true;
      try {
        // 시설별 사진: Storage에서 바이트 가져오기 (업로드 완료된 것만)
        const compressed = {};
        let done = 0, totalPhotos = 0;
        for (const k in photosByKey) totalPhotos += (photosByKey[k] || []).filter((p) => p.path).length;
        for (const [, key] of FACILITIES) {
          const items = (photosByKey[key] || []).filter((p) => p.path);
          if (!items.length) continue;
          compressed[key] = [];
          for (const item of items) {
            setStatus(`사진 불러오는 중… (${++done}/${totalPhotos})`);
            const bytes = await fetchPhotoBytes(item.path);
            compressed[key].push({ idref: "photo" + item.id, bytes, w: item.w, h: item.h, caption: item.caption });
          }
        }
        setStatus("한글파일 생성 중…");
        const blob = await buildHwpx(currentOffice, data, compressed);
        const fname = `일일업무일지_${currentOffice}_${Y}년${M}월${D}일.hwpx`;
        downloadBlob(blob, fname);
        let totKB = 0;
        for (const k in compressed) for (const p of compressed[k]) totKB += p.bytes.length;
        setStatus(`✅ 다운로드 완료: ${fname}` + (totalPhotos ? ` (사진 ${totalPhotos}장, ${(totKB / 1024).toFixed(0)}KB)` : ""), "ok");
      } catch (err) {
        console.error(err);
        setStatus("❌ 오류: " + err.message, "err");
      } finally {
        btn.disabled = false;
      }
    });

    // 한 달치 다운로드
    const monthEl = document.getElementById("month");
    monthEl.value = dateEl.value.slice(0, 7);
    document.getElementById("monthDownload").addEventListener("click", async (e) => {
      const ym = monthEl.value;
      if (!ym) { setStatus("월을 선택하세요.", "err"); return; }
      const btn = e.currentTarget; btn.disabled = true;
      setStatus("한 달치 불러오는 중…");
      try {
        const days = await listMonth(currentOffice, ym);
        if (!days.length) { setStatus(`${currentOffice} ${ym} 에 저장된 일지가 없어요.`, "err"); return; }
        setStatus(`한글파일 생성 중… (${days.length}일)`);
        const blob = await buildMonthHwpx(currentOffice, days);
        const [yy, mm] = ym.split("-");
        downloadBlob(blob, `일일업무일지_${currentOffice}_${yy}년${mm}월.hwpx`);
        setStatus(`✅ ${currentOffice} ${ym} 한 달치 다운로드 (${days.length}일)`, "ok");
      } catch (err) {
        console.error(err);
        setStatus("❌ 오류: " + err.message, "err");
      } finally {
        btn.disabled = false;
      }
    });

    // ===== 지난 일지 검색 =====
    const searchModal = document.getElementById("searchModal");
    const searchOfficeEl = document.getElementById("searchOffice");
    searchOfficeEl.innerHTML = `<option value="">전체 국</option>` + OFFICE_LIST.map((o) => `<option>${o}</option>`).join("");
    document.getElementById("searchOpen").addEventListener("click", () => { searchModal.style.display = "block"; document.getElementById("searchQ").focus(); });
    document.getElementById("searchClose").addEventListener("click", () => searchModal.style.display = "none");
    searchModal.addEventListener("click", (e) => { if (e.target === searchModal) searchModal.style.display = "none"; });

    async function runSearch() {
      const q = document.getElementById("searchQ").value.trim();
      const box = document.getElementById("searchResults");
      if (!q) { box.innerHTML = `<div style="color:#8a94a3;padding:8px">키워드를 입력하세요.</div>`; return; }
      box.innerHTML = `<div style="color:#8a94a3;padding:8px">검색 중…</div>`;
      try {
        const rows = await searchLogs(q, searchOfficeEl.value);
        if (!rows.length) { box.innerHTML = `<div style="color:#8a94a3;padding:8px">결과가 없어요.</div>`; return; }
        const esc = (s) => (s || "").replace(/</g, "&lt;");
        box.innerHTML = `<div style="font-size:.82rem;color:#667;margin-bottom:6px">${rows.length}건</div>` + rows.map((r) => `
          <div class="sr" data-office="${esc(r.office)}" data-date="${r.log_date}" style="border:1px solid var(--line);border-radius:8px;padding:9px 11px;margin-bottom:8px;cursor:pointer">
            <div style="font-size:.8rem;color:#667"><b style="color:#2f6fed">${esc(r.office)}</b> · ${r.log_date} · ${esc(labelForKey(r.key))}</div>
            <div style="font-size:.9rem;margin-top:3px">${esc(r.snippet)}</div>
          </div>`).join("");
        for (const el of box.querySelectorAll(".sr"))
          el.addEventListener("click", () => jumpTo(el.dataset.office, el.dataset.date));
      } catch (e) { box.innerHTML = `<div style="color:#b3261e;padding:8px">검색 오류: ${e.message}</div>`; }
    }
    document.getElementById("searchGo").addEventListener("click", runSearch);
    document.getElementById("searchQ").addEventListener("keydown", (e) => { if (e.key === "Enter") runSearch(); });

    async function jumpTo(office, date) {
      searchModal.style.display = "none";
      currentOffice = office;
      localStorage.setItem("ilji_office", office);
      officeEl.value = office;
      buildFacilityCards();
      dateEl.value = date;
      await loadForDate();
      setStatus(`🔍 ${office} ${date} 로 이동`, "ok");
      window.scrollTo({ top: 0, behavior: "smooth" });
    }
  </script>
</body>
</html>
